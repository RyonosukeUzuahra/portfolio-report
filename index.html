  @media (prefers-color-scheme: dark) {
    :root { --bg: #14161a; --fg: #eceef1; --card-bg: #1e2126; --border: #33373f; --accent: #6ea8fe; --warn-bg: #3a2f12; --warn-border: #caa23a; }

  .timestamp { color: #888; font-size: 0.9rem; margin-bottom: 20px; }
  .banner { background: var(--warn-bg); border: 1px solid var(--warn-border); border-radius: 8px; padding: 16px; font-weight: 600; margin-bottom: 20px; }
  .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  .disclaimer { font-size: 0.85rem; color: #888; border-top: 1px solid var(--border); padding-top: 16px; margin-top: 24px; }
