<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-08-05</title>
<style>
  :root {
    --bg: #f5f6f8; --card-bg: #ffffff; --text: #1a1d21; --muted: #5a6270;
    --border: #e2e5ea; --accent: #2563eb; --warn-bg: #fff8e6; --warn-border: #e0b93c; --warn-text: #7a5b00;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14161a; --card-bg: #1e2126; --text: #e8eaed; --muted: #9aa2af;
      --border: #2c3038; --accent: #5b8def; --warn-bg: #332a0f; --warn-border: #8a6d1c; --warn-text: #ffe08a; }
  }
  :root[data-theme="dark"] { --bg: #14161a; --card-bg: #1e2126; --text: #e8eaed; --muted: #9aa2af;
    --border: #2c3038; --accent: #5b8def; --warn-bg: #332a0f; --warn-border: #8a6d1c; --warn-text: #ffe08a; }
  :root[data-theme="light"] { --bg: #f5f6f8; --card-bg: #ffffff; --text: #1a1d21; --muted: #5a6270;
    --border: #e2e5ea; --accent: #2563eb; --warn-bg: #fff8e6; --warn-border: #e0b93c; --warn-text: #7a5b00; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 2rem 1rem; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    line-height: 1.75; font-size: 15px; }
  .container { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
  .timestamp { color: var(--muted); font-size: 0.85rem; margin-bottom: 1.25rem; }
  .banner { border-radius: 8px; padding: 1rem 1.25rem; margin-bottom: 1rem; font-weight: 600;
    border: 1px solid var(--warn-border); background: var(--warn-bg); color: var(--warn-text); }
  .disclaimer { color: var(--muted); font-size: 0.85rem; margin-top: 2.5rem; border-top: 1px solid var(--border); padding-top: 1rem; }
</style>
</head>
<body>
<div class="container">
  <h1>デイリー・ポートフォリオレポート 2026-08-05</h1>
  <div class="timestamp">生成開始 2026-08-05 08:37 JST</div>
  <div class="banner">
    ⏳ このレポートは現在生成中です。数分後に再読み込みしてください。
  </div>
  <p class="disclaimer">
    これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。
  </p>
</div>
</body>
</html>
