<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-08-18</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6f8;
    --card-bg: #ffffff;
    --text: #1a1d23;
    --muted: #5b6270;
    --border: #e1e4ea;
    --accent: #2563eb;
    --banner-bg: #fff8e1;
    --banner-border: #f5c518;
    --banner-text: #7a5c00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --card-bg: #1d2026;
      --text: #e8eaed;
      --muted: #9aa1ac;
      --border: #2c303a;
      --accent: #5b9dff;
      --banner-bg: #3a2f00;
      --banner-border: #8a6d00;
      --banner-text: #ffe27a;
    }
  }
  [data-theme="dark"] {
    --bg: #14161a;
    --card-bg: #1d2026;
    --text: #e8eaed;
    --muted: #9aa1ac;
    --border: #2c303a;
    --accent: #5b9dff;
    --banner-bg: #3a2f00;
    --banner-border: #8a6d00;
    --banner-text: #ffe27a;
  }
  [data-theme="light"] {
    --bg: #f5f6f8;
    --card-bg: #ffffff;
    --text: #1a1d23;
    --muted: #5b6270;
    --border: #e1e4ea;
    --accent: #2563eb;
    --banner-bg: #fff8e1;
    --banner-border: #f5c518;
    --banner-text: #7a5c00;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem 1rem;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", Meiryo, sans-serif;
    line-height: 1.7;
  }
  .container { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
  .timestamp { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
  .banner {
    background: var(--banner-bg);
    border: 1px solid var(--banner-border);
    color: var(--banner-text);
    padding: 1rem 1.25rem;
    border-radius: 8px;
    font-weight: 600;
    margin-bottom: 1.5rem;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.25rem 1.5rem;
    margin-bottom: 1.5rem;
  }
  .disclaimer {
    color: var(--muted);
    font-size: 0.85rem;
    border-top: 1px solid var(--border);
    padding-top: 1rem;
    margin-top: 2rem;
  }
</style>
</head>
<body>
<div class="container">
  <h1>デイリー・ポートフォリオレポート 2026-08-18</h1>
  <div class="timestamp">生成開始 07:04 JST</div>
  <div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
  <div class="card">
    <p>本レポートは自動生成中です。保有銘柄・ウォッチリストの価格確認、ニュース分析、判定処理を実行しています。完了までしばらくお待ちください。</p>
  </div>
  <div class="disclaimer">
    これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。
  </div>
</div>
</body>
</html>
