<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-09-13</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f5;
    --fg: #1a1a1a;
    --card-bg: #ffffff;
    --border: #ddd;
    --banner-bg: #fff8e1;
    --banner-border: #f5c518;
    --muted: #666;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171a;
      --fg: #e8e8e6;
      --card-bg: #1f2226;
      --border: #333;
      --banner-bg: #332b00;
      --banner-border: #d4a900;
      --muted: #aaa;
    }
  }
  :root[data-theme="light"] {
    --bg: #f7f7f5; --fg: #1a1a1a; --card-bg: #ffffff; --border: #ddd; --banner-bg: #fff8e1; --banner-border: #f5c518; --muted: #666;
  }
  :root[data-theme="dark"] {
    --bg: #15171a; --fg: #e8e8e6; --card-bg: #1f2226; --border: #333; --banner-bg: #332b00; --banner-border: #d4a900; --muted: #aaa;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    line-height: 1.7;
  }
  .wrap { max-width: 780px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .timestamp { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
  .banner {
    background: var(--banner-bg);
    border: 1px solid var(--banner-border);
    border-radius: 8px;
    padding: 16px;
    font-weight: bold;
    margin-bottom: 20px;
  }
  .disclaimer {
    margin-top: 32px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.85rem;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>デイリー・ポートフォリオレポート 2026-09-13</h1>
  <div class="timestamp">生成開始 2026-09-13 07:02 JST</div>
  <div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
  <div class="disclaimer">これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。</div>
</div>
</body>
</html>
