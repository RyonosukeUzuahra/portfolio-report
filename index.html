<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-10-31</title>
<style>
  :root {
    --bg: #f8f9fb;
    --fg: #1a1d23;
    --card-bg: #ffffff;
    --border: #e2e5ea;
    --accent: #2563eb;
    --warn-bg: #fff7e6;
    --warn-border: #f0ad4e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --fg: #e8eaed;
      --card-bg: #1e2127;
      --border: #30343b;
      --accent: #5b8def;
      --warn-bg: #3a2f14;
      --warn-border: #f0ad4e;
    }
  }
  :root[data-theme="light"] {
    --bg: #f8f9fb; --fg: #1a1d23; --card-bg: #ffffff; --border: #e2e5ea; --accent: #2563eb;
    --warn-bg: #fff7e6; --warn-border: #f0ad4e;
  }
  :root[data-theme="dark"] {
    --bg: #14161a; --fg: #e8eaed; --card-bg: #1e2127; --border: #30343b; --accent: #5b8def;
    --warn-bg: #3a2f14; --warn-border: #f0ad4e;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", -apple-system, BlinkMacSystemFont, sans-serif;
    margin: 0;
    padding: 24px 16px;
    line-height: 1.7;
  }
  .container { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .timestamp { color: #888; font-size: 0.9rem; margin-bottom: 20px; }
  .banner {
    background: var(--warn-bg);
    border: 1px solid var(--warn-border);
    border-radius: 8px;
    padding: 16px;
    font-size: 1.05rem;
    margin-bottom: 20px;
  }
  .disclaimer {
    margin-top: 32px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: 0.85rem;
    color: #888;
  }
</style>
</head>
<body>
<div class="container">
  <h1>デイリー・ポートフォリオレポート 2026-10-31</h1>
  <div class="timestamp">生成開始 2026-10-31 07:03 JST</div>
  <div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
  <div class="disclaimer">これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。</div>
</div>
</body>
</html>
