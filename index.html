<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-10-26</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1a1a1a; --card-bg: #f5f5f7; --border: #e0e0e0; --accent: #2563eb; --warn-bg: #fff7ed; --warn-border: #ea580c;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #16181c; --fg: #e8e8e8; --card-bg: #22252a; --border: #333; --accent: #60a5fa; --warn-bg: #2a2015; --warn-border: #ea580c; }
  }
  :root[data-theme="dark"] { --bg: #16181c; --fg: #e8e8e8; --card-bg: #22252a; --border: #333; --accent: #60a5fa; --warn-bg: #2a2015; --warn-border: #ea580c; }
  body { background: var(--bg); color: var(--fg); font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; margin: 0; padding: 24px; line-height: 1.6; }
  .container { max-width: 800px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
  .timestamp { color: #888; font-size: 0.9rem; margin-bottom: 1.5rem; }
  .banner { background: var(--warn-bg); border: 1px solid var(--warn-border); border-radius: 8px; padding: 16px 20px; font-size: 1.1rem; margin-bottom: 1.5rem; }
  .disclaimer { margin-top: 2rem; font-size: 0.85rem; color: #888; border-top: 1px solid var(--border); padding-top: 1rem; }
</style>
</head>
<body>
<div class="container">
  <h1>デイリー・ポートフォリオレポート 2026-10-26</h1>
  <div class="timestamp">生成開始 07:03 JST</div>
  <div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
  <div class="disclaimer">これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。</div>
</div>
</body>
</html>
