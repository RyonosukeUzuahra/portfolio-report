<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-11-18</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #6b7280;
    --card-bg: #f8f9fb;
    --border: #e2e5ea;
    --banner-bg: #fff7e6;
    --banner-border: #f0b429;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11141a;
      --fg: #e8e9ec;
      --muted: #9aa0ac;
      --card-bg: #1a1e26;
      --border: #2a2f3a;
      --banner-bg: #332a10;
      --banner-border: #f0b429;
    }
  }
  html[data-theme="light"] {
    --bg: #ffffff; --fg: #1a1a1a; --muted: #6b7280; --card-bg: #f8f9fb; --border: #e2e5ea;
    --banner-bg: #fff7e6; --banner-border: #f0b429;
  }
  html[data-theme="dark"] {
    --bg: #11141a; --fg: #e8e9ec; --muted: #9aa0ac; --card-bg: #1a1e26; --border: #2a2f3a;
    --banner-bg: #332a10; --banner-border: #f0b429;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
    margin: 0;
    padding: 24px 16px;
    line-height: 1.7;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .timestamp { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
  .banner {
    background: var(--banner-bg);
    border: 1px solid var(--banner-border);
    border-radius: 8px;
    padding: 14px 16px;
    font-weight: 600;
    margin-bottom: 20px;
  }
  .disclaimer {
    margin-top: 32px;
    font-size: 0.85rem;
    color: var(--muted);
    border-top: 1px solid var(--border);
    padding-top: 16px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>デイリー・ポートフォリオレポート 2026-11-18</h1>
  <div class="timestamp">生成開始 2026-11-18 07:39 JST</div>
  <div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
  <div class="disclaimer">これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。</div>
</div>
</body>
</html>
