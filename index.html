<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-08-29</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7fa;
    --fg: #1a1a1a;
    --card-bg: #ffffff;
    --border: #e2e2e8;
    --accent: #2563eb;
    --banner-bg: #fff7ed;
    --banner-fg: #9a3412;
    --banner-border: #fdba74;
    --muted: #6b7280;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121214;
      --fg: #e5e5ea;
      --card-bg: #1c1c1f;
      --border: #313136;
      --accent: #60a5fa;
      --banner-bg: #3a2a12;
      --banner-fg: #fbbf24;
      --banner-border: #92400e;
      --muted: #9ca3af;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121214;
    --fg: #e5e5ea;
    --card-bg: #1c1c1f;
    --border: #313136;
    --accent: #60a5fa;
    --banner-bg: #3a2a12;
    --banner-fg: #fbbf24;
    --banner-border: #92400e;
    --muted: #9ca3af;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    margin: 0;
    padding: 24px 16px 64px;
    line-height: 1.7;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .timestamp { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
  .banner {
    background: var(--banner-bg);
    color: var(--banner-fg);
    border: 1px solid var(--banner-border);
    border-radius: 8px;
    padding: 16px 18px;
    font-weight: 600;
    margin-bottom: 24px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 16px;
  }
  .disclaimer {
    color: var(--muted);
    font-size: 0.85rem;
    border-top: 1px solid var(--border);
    padding-top: 16px;
    margin-top: 32px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>デイリー・ポートフォリオレポート 2026-08-29</h1>
  <div class="timestamp">生成開始 2026-08-29 07:05 JST</div>
  <div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
  <div class="card">
    価格データ・テクニカル指標・セクター分析・ニュース分析・仮想オートマティック取引セクションを順次生成しています。しばらくお待ちください。
  </div>
  <div class="disclaimer">
    これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。
  </div>
</div>
</body>
</html>
