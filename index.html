<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-10-29</title>
<style>
  :root {
    --bg: #f7f7f9;
    --fg: #1a1a1a;
    --card-bg: #ffffff;
    --border: #e0e0e0;
    --banner-bg: #fff3cd;
    --banner-fg: #664d03;
    --muted: #666;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212;
      --fg: #e8e8e8;
      --card-bg: #1e1e1e;
      --border: #333;
      --banner-bg: #3a2f00;
      --banner-fg: #ffe69c;
      --muted: #aaa;
    }
  }
  :root[data-theme="light"] {
    --bg: #f7f7f9; --fg: #1a1a1a; --card-bg: #ffffff; --border: #e0e0e0;
    --banner-bg: #fff3cd; --banner-fg: #664d03; --muted: #666;
  }
  :root[data-theme="dark"] {
    --bg: #121212; --fg: #e8e8e8; --card-bg: #1e1e1e; --border: #333;
    --banner-bg: #3a2f00; --banner-fg: #ffe69c; --muted: #aaa;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    margin: 0;
    padding: 24px 16px;
    line-height: 1.7;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .timestamp { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
  .banner {
    background: var(--banner-bg);
    color: var(--banner-fg);
    border-radius: 8px;
    padding: 16px;
    font-weight: bold;
    margin-bottom: 20px;
  }
  .disclaimer {
    margin-top: 32px;
    font-size: 0.85rem;
    color: var(--muted);
    border-top: 1px solid var(--border);
    padding-top: 16px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>デイリー・ポートフォリオレポート 2026-10-29</h1>
  <div class="timestamp">生成開始 2026-10-29 07:03 JST</div>
  <div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
  <div class="disclaimer">これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。</div>
</div>
</body>
</html>
