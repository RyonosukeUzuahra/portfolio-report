<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-08-15</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card-bg: #ffffff;
    --text: #1a1d23;
    --muted: #5b6270;
    --border: #e2e5ea;
    --accent: #2563eb;
    --warn-bg: #fff8e1;
    --warn-border: #f0c419;
    --warn-text: #7a5b00;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161a;
      --card-bg: #1d2026;
      --text: #e8eaed;
      --muted: #9aa1ac;
      --border: #2c3038;
      --accent: #6ea8fe;
      --warn-bg: #3a2f00;
      --warn-border: #8a6d00;
      --warn-text: #f5d76e;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161a;
    --card-bg: #1d2026;
    --text: #e8eaed;
    --muted: #9aa1ac;
    --border: #2c3038;
    --accent: #6ea8fe;
    --warn-bg: #3a2f00;
    --warn-border: #8a6d00;
    --warn-text: #f5d76e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem 1rem;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    line-height: 1.7;
  }
  .container {
    max-width: 720px;
    margin: 0 auto;
  }
  h1 {
    font-size: 1.5rem;
    margin-bottom: 0.25rem;
  }
  .timestamp {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 1.5rem;
  }
  .banner {
    background: var(--warn-bg);
    border: 1px solid var(--warn-border);
    color: var(--warn-text);
    border-radius: 8px;
    padding: 1rem 1.25rem;
    font-weight: 600;
    margin-bottom: 1.5rem;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.25rem;
    margin-bottom: 1rem;
  }
  .disclaimer {
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 2rem;
    border-top: 1px solid var(--border);
    padding-top: 1rem;
  }
</style>
</head>
<body>
<div class="container">
  <h1>デイリー・ポートフォリオレポート 2026-08-15</h1>
  <div class="timestamp">生成開始 2026-08-15 07:03 JST</div>
  <div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
  <div class="card">
    レポートを生成中です。価格データの確認、ニュース収集、分析セクションの作成を進めています。しばらくしてから再度アクセスしてください。
  </div>
  <div class="disclaimer">
    これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。
  </div>
</div>
</body>
</html>
