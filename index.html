<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-08-22</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7fa;
    --fg: #1a1a1e;
    --card-bg: #ffffff;
    --border: #e2e2e8;
    --muted: #6b7280;
    --accent: #2563eb;
    --banner-bg: #fef3c7;
    --banner-fg: #92400e;
    --banner-border: #f59e0b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14141a;
      --fg: #e5e7eb;
      --card-bg: #1e1e26;
      --border: #33333d;
      --muted: #9ca3af;
      --accent: #60a5fa;
      --banner-bg: #3a2f0a;
      --banner-fg: #fde68a;
      --banner-border: #b45309;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14141a;
    --fg: #e5e7eb;
    --card-bg: #1e1e26;
    --border: #33333d;
    --muted: #9ca3af;
    --accent: #60a5fa;
    --banner-bg: #3a2f0a;
    --banner-fg: #fde68a;
    --banner-border: #b45309;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem 1rem;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
  .timestamp { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
  .banner {
    background: var(--banner-bg);
    color: var(--banner-fg);
    border: 1px solid var(--banner-border);
    border-radius: 8px;
    padding: 1rem 1.25rem;
    font-weight: 600;
    margin-bottom: 1.5rem;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.25rem;
    margin-bottom: 1rem;
  }
  .disclaimer {
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 2rem;
    border-top: 1px solid var(--border);
    padding-top: 1rem;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>デイリー・ポートフォリオレポート 2026-08-22</h1>
  <div class="timestamp">生成開始 07:02 JST</div>
  <div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
  <div class="card">
    価格データの読み込みと分析を実行中です。完了次第、このページは自動的に本日分のレポートに置き換わります。
  </div>
  <div class="disclaimer">
    これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。
  </div>
</div>
</body>
</html>
