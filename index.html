<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-11-05</title>
<style>
  :root {
    --bg: #f7f7f9;
    --fg: #1a1a1a;
    --card-bg: #ffffff;
    --border: #e0e0e5;
    --accent: #2563eb;
    --banner-bg: #fff8e1;
    --banner-fg: #7a5c00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212;
      --fg: #e8e8e8;
      --card-bg: #1e1e1e;
      --border: #333;
      --accent: #60a5fa;
      --banner-bg: #332b00;
      --banner-fg: #ffe066;
    }
  }
  :root[data-theme="light"] {
    --bg: #f7f7f9; --fg: #1a1a1a; --card-bg: #ffffff; --border: #e0e0e5; --accent: #2563eb; --banner-bg: #fff8e1; --banner-fg: #7a5c00;
  }
  :root[data-theme="dark"] {
    --bg: #121212; --fg: #e8e8e8; --card-bg: #1e1e1e; --border: #333; --accent: #60a5fa; --banner-bg: #332b00; --banner-fg: #ffe066;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    margin: 0;
    padding: 24px;
    line-height: 1.6;
  }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .timestamp { color: #888; font-size: 0.9rem; margin-bottom: 20px; }
  .banner {
    background: var(--banner-bg);
    color: var(--banner-fg);
    border-radius: 8px;
    padding: 16px 20px;
    font-weight: bold;
    font-size: 1.1rem;
    margin-bottom: 20px;
    border: 1px solid var(--border);
  }
  .disclaimer {
    margin-top: 40px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: 0.85rem;
    color: #888;
  }
</style>
</head>
<body>
  <h1>デイリー・ポートフォリオレポート 2026-11-05</h1>
  <div class="timestamp">生成開始 07:36 JST</div>
  <div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
  <div class="disclaimer">これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。</div>
</body>
</html>
