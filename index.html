<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-09-16</title>
<style>
  :root {
    --bg: #f7f7f9;
    --fg: #1a1a1a;
    --card-bg: #ffffff;
    --border: #e0e0e0;
    --banner-bg: #fff8e1;
    --banner-fg: #7a5b00;
    --muted: #666;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212;
      --fg: #e8e8e8;
      --card-bg: #1e1e1e;
      --border: #333;
      --banner-bg: #3a2f00;
      --banner-fg: #ffd54f;
      --muted: #aaa;
    }
  }
  [data-theme="light"] {
    --bg: #f7f7f9; --fg: #1a1a1a; --card-bg: #ffffff; --border: #e0e0e0;
    --banner-bg: #fff8e1; --banner-fg: #7a5b00; --muted: #666;
  }
  [data-theme="dark"] {
    --bg: #121212; --fg: #e8e8e8; --card-bg: #1e1e1e; --border: #333;
    --banner-bg: #3a2f00; --banner-fg: #ffd54f; --muted: #aaa;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    margin: 0;
    padding: 20px;
    line-height: 1.6;
  }
  .container { max-width: 800px; margin: 0 auto; }
  h1 { font-size: 1.5rem; }
  .timestamp { color: var(--muted); font-size: 0.9rem; }
  .banner {
    background: var(--banner-bg);
    color: var(--banner-fg);
    border-radius: 8px;
    padding: 16px;
    margin: 20px 0;
    font-weight: bold;
    text-align: center;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin: 16px 0;
  }
  .disclaimer {
    font-size: 0.85rem;
    color: var(--muted);
    margin-top: 30px;
    border-top: 1px solid var(--border);
    padding-top: 16px;
  }
</style>
</head>
<body>
<div class="container">
  <h1>デイリー・ポートフォリオレポート 2026-09-16</h1>
  <p class="timestamp">生成開始 2026-09-16 07:03 JST</p>
  <div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
  <div class="card">
    <p>現在、価格データの確認とテクニカル分析、ニュース収集を行っています。完成まで今しばらくお待ちください。</p>
  </div>
  <p class="disclaimer">これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。</p>
</div>
</body>
</html>
