<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-11-10</title>
<style>
  :root {
    --bg: #f8fafc; --fg: #0f172a; --card-bg: #ffffff; --border: #e2e8f0;
    --muted: #64748b; --banner-bg: #fef3c7; --banner-fg: #92400e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f172a; --fg: #e2e8f0; --card-bg: #1e293b; --border: #334155;
      --muted: #94a3b8; --banner-bg: #422006; --banner-fg: #fde68a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f172a; --fg: #e2e8f0; --card-bg: #1e293b; --border: #334155;
    --muted: #94a3b8; --banner-bg: #422006; --banner-fg: #fde68a;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: "Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
    margin: 0; padding: 0 12px 40px; line-height: 1.7; font-size: 15px;
  }
  .wrap { max-width: 1000px; margin: 0 auto; }
  h1 { font-size: 1.3rem; margin: 16px 0 2px; }
  .timestamp { color: var(--muted); font-size: 0.85rem; margin-bottom: 10px; }
  .banner { background: var(--banner-bg); color: var(--banner-fg); border-radius: 8px; padding: 14px 18px; font-weight: bold; margin: 16px 0; font-size: 1rem; }
  .footnote { color: var(--muted); font-size: 0.8rem; margin-top: 2rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>デイリー・ポートフォリオレポート 2026-11-10</h1>
  <div class="timestamp">生成開始 07:39 JST</div>
  <div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
  <p class="footnote">これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。</p>
</div>
</body>
</html>
