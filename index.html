<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-10-14</title>
<style>
  :root {
    --bg: #f8fafc;
    --fg: #0f172a;
    --card-bg: #ffffff;
    --border: #e2e8f0;
    --banner-bg: #fef3c7;
    --banner-fg: #92400e;
    --muted: #64748b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --fg: #e2e8f0;
      --card-bg: #1e293b;
      --border: #334155;
      --banner-bg: #78350f;
      --banner-fg: #fde68a;
      --muted: #94a3b8;
    }
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
    margin: 0;
    padding: 24px 16px;
    line-height: 1.7;
  }
  .container { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .timestamp { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
  .banner {
    background: var(--banner-bg);
    color: var(--banner-fg);
    border-radius: 8px;
    padding: 16px;
    font-weight: bold;
    margin-bottom: 24px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .disclaimer { color: var(--muted); font-size: 0.85rem; margin-top: 32px; border-top: 1px solid var(--border); padding-top: 16px; }
</style>
</head>
<body>
  <div class="container">
    <h1>デイリー・ポートフォリオレポート 2026-10-14</h1>
    <div class="timestamp">生成開始 07:03 JST</div>
    <div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
    <div class="card">
      <p>価格データの読み込み、テクニカル分析、セクター分析、仮想取引セクションなどを順次生成しています。しばらくお待ちください。</p>
    </div>
    <div class="disclaimer">
      これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。
    </div>
  </div>
</body>
</html>
