<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-10-28</title>
<style>
  :root {
    --bg: #f8fafc; --fg: #0f172a; --card-bg: #ffffff; --border: #e2e8f0; --accent: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f172a; --fg: #e2e8f0; --card-bg: #1e293b; --border: #334155; --accent: #60a5fa; }
  }
  :root[data-theme="light"] { --bg: #f8fafc; --fg: #0f172a; --card-bg: #ffffff; --border: #e2e8f0; --accent: #2563eb; }
  :root[data-theme="dark"] { --bg: #0f172a; --fg: #e2e8f0; --card-bg: #1e293b; --border: #334155; --accent: #60a5fa; }
  body {
    background: var(--bg); color: var(--fg); font-family: -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif;
    margin: 0; padding: 24px 16px; line-height: 1.7;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .timestamp { color: #64748b; font-size: 0.9rem; margin-bottom: 20px; }
  .banner {
    background: #fef3c7; border: 1px solid #f59e0b; color: #78350f; border-radius: 8px;
    padding: 16px; font-weight: 600; margin-bottom: 20px;
  }
  @media (prefers-color-scheme: dark) {
    .banner { background: #451a03; border-color: #92400e; color: #fde68a; }
  }
  :root[data-theme="dark"] .banner { background: #451a03; border-color: #92400e; color: #fde68a; }
  .disclaimer { font-size: 0.85rem; color: #64748b; border-top: 1px solid var(--border); padding-top: 16px; margin-top: 24px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>デイリー・ポートフォリオレポート 2026-10-28</h1>
  <div class="timestamp">生成開始 2026-10-28 07:03 JST</div>
  <div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
  <div class="disclaimer">これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。</div>
</div>
</body>
</html>
