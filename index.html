<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-09-08</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --fg: #0f172a;
    --card-bg: #ffffff;
    --border: #e2e8f0;
    --accent: #2563eb;
    --banner-bg: #fef3c7;
    --banner-fg: #92400e;
    --muted: #64748b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b1220;
      --fg: #e2e8f0;
      --card-bg: #111827;
      --border: #1f2937;
      --accent: #60a5fa;
      --banner-bg: #451a03;
      --banner-fg: #fde68a;
      --muted: #94a3b8;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b1220;
    --fg: #e2e8f0;
    --card-bg: #111827;
    --border: #1f2937;
    --accent: #60a5fa;
    --banner-bg: #451a03;
    --banner-fg: #fde68a;
    --muted: #94a3b8;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
    max-width: 800px;
    margin: 0 auto;
    padding: 24px 16px 60px;
    line-height: 1.7;
  }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .timestamp { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
  .banner {
    background: var(--banner-bg);
    color: var(--banner-fg);
    border-radius: 8px;
    padding: 16px 20px;
    font-weight: 600;
    font-size: 1.05rem;
    margin-bottom: 24px;
  }
  .disclaimer {
    margin-top: 32px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.85rem;
  }
</style>
</head>
<body>
<h1>デイリー・ポートフォリオレポート 2026-09-08</h1>
<div class="timestamp">生成開始 07:04 JST</div>
<div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
<div class="disclaimer">これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。</div>
</body>
</html>
