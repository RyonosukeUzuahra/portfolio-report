<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-10-27</title>
<style>
  :root {
    --bg: #f8fafc;
    --fg: #0f172a;
    --card-bg: #ffffff;
    --border: #e2e8f0;
    --banner-bg: #fff7ed;
    --banner-border: #fb923c;
    --banner-fg: #9a3412;
    --muted: #64748b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1220;
      --fg: #e5e9f0;
      --card-bg: #121a2b;
      --border: #263249;
      --banner-bg: #2b2109;
      --banner-border: #d97706;
      --banner-fg: #fde68a;
      --muted: #94a3b8;
    }
  }
  :root[data-theme="light"] {
    --bg: #f8fafc; --fg: #0f172a; --card-bg: #ffffff; --border: #e2e8f0;
    --banner-bg: #fff7ed; --banner-border: #fb923c; --banner-fg: #9a3412; --muted: #64748b;
  }
  :root[data-theme="dark"] {
    --bg: #0b1220; --fg: #e5e9f0; --card-bg: #121a2b; --border: #263249;
    --banner-bg: #2b2109; --banner-border: #d97706; --banner-fg: #fde68a; --muted: #94a3b8;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Segoe UI", Meiryo, sans-serif;
    margin: 0;
    padding: 24px 16px;
    line-height: 1.7;
  }
  .wrap { max-width: 800px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .timestamp { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
  .banner {
    background: var(--banner-bg);
    border: 1px solid var(--banner-border);
    color: var(--banner-fg);
    border-radius: 8px;
    padding: 16px;
    font-weight: 600;
    margin-bottom: 20px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .disclaimer {
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 32px;
    border-top: 1px solid var(--border);
    padding-top: 16px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>デイリー・ポートフォリオレポート 2026-10-27</h1>
  <div class="timestamp">生成開始 2026-10-27 07:03 JST</div>
  <div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
  <div class="card">
    現在、保有銘柄とウォッチリストの価格確認、ニュース収集、テクニカル分析、セクター配分分析を実施中です。完成したレポートは数分以内にこのページに自動的に反映されます。
  </div>
  <div class="disclaimer">
    これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。
  </div>
</div>
</body>
</html>
