<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-10-03</title>
<style>
  :root {
    --bg: #f8fafc;
    --fg: #0f172a;
    --card-bg: #ffffff;
    --border: #e2e8f0;
    --banner-bg: #fef3c7;
    --banner-fg: #92400e;
    --muted: #64748b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1220;
      --fg: #e2e8f0;
      --card-bg: #121a2b;
      --border: #263249;
      --banner-bg: #3f2d0a;
      --banner-fg: #fde68a;
      --muted: #94a3b8;
    }
  }
  :root[data-theme="light"] {
    --bg: #f8fafc; --fg: #0f172a; --card-bg: #ffffff; --border: #e2e8f0;
    --banner-bg: #fef3c7; --banner-fg: #92400e; --muted: #64748b;
  }
  :root[data-theme="dark"] {
    --bg: #0b1220; --fg: #e2e8f0; --card-bg: #121a2b; --border: #263249;
    --banner-bg: #3f2d0a; --banner-fg: #fde68a; --muted: #94a3b8;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    margin: 0;
    padding: 24px 16px;
    line-height: 1.7;
  }
  .container {
    max-width: 720px;
    margin: 0 auto;
  }
  h1 {
    font-size: 1.5rem;
    margin-bottom: 4px;
  }
  .timestamp {
    color: var(--muted);
    font-size: 0.95rem;
    margin-bottom: 20px;
  }
  .banner {
    background: var(--banner-bg);
    color: var(--banner-fg);
    border-radius: 10px;
    padding: 16px 20px;
    font-weight: 600;
    font-size: 1.05rem;
    margin-bottom: 24px;
    border: 1px solid var(--border);
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 20px;
    margin-bottom: 16px;
  }
  .disclaimer {
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 24px;
    border-top: 1px solid var(--border);
    padding-top: 16px;
  }
</style>
</head>
<body>
<div class="container">
  <h1>デイリー・ポートフォリオレポート 2026-10-03</h1>
  <div class="timestamp">生成開始 2026-10-03 07:02 JST</div>
  <div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
  <div class="card">
    現在、価格データ・テクニカル指標・ニュース分析・セクター配分・仮想取引セクションを含むフルレポートを生成しています。生成が完了次第、このページは自動的に最新版に置き換わります。
  </div>
  <div class="disclaimer">
    これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。
  </div>
</div>
</body>
</html>
