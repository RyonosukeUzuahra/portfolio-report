<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-10-10</title>
<style>
  :root {
    --bg: #f7f8fa; --fg: #1a1a2e; --card-bg: #ffffff; --border: #e2e4e9;
    --banner-bg: #fff8e1; --banner-border: #f59e0b; --banner-fg: #7c5800;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15161d; --fg: #e8e8ec; --card-bg: #1e2029; --border: #33353f;
      --banner-bg: #2d2611; --banner-border: #f59e0b; --banner-fg: #ffd77a; }
  }
  :root[data-theme="light"] { --bg: #f7f8fa; --fg: #1a1a2e; --card-bg: #ffffff; --border: #e2e4e9;
    --banner-bg: #fff8e1; --banner-border: #f59e0b; --banner-fg: #7c5800; }
  :root[data-theme="dark"] { --bg: #15161d; --fg: #e8e8ec; --card-bg: #1e2029; --border: #33353f;
    --banner-bg: #2d2611; --banner-border: #f59e0b; --banner-fg: #ffd77a; }
  body { background: var(--bg); color: var(--fg); font-family: "Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
    margin: 0; padding: 24px 16px; line-height: 1.7; }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .ts { color: #888; font-size: 0.9rem; margin-bottom: 20px; }
  .banner { background: var(--banner-bg); border: 1px solid var(--banner-border); color: var(--banner-fg);
    border-radius: 8px; padding: 16px; font-weight: bold; margin-bottom: 20px; }
  .disclaimer { margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--border); font-size: 0.85rem; color: #888; }
  .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>デイリー・ポートフォリオレポート 2026-10-10</h1>
  <div class="ts">生成開始 07:03 JST</div>
  <div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
  <div class="card">

  </div>
</div>
</body>
</html>
