<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-08-25</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6f8;
    --fg: #1a1a1a;
    --card-bg: #ffffff;
    --border: #d9dce1;
    --accent: #2563eb;
    --warn-bg: #fff7ed;
    --warn-border: #ea580c;
    --warn-fg: #7c2d12;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121317;
      --fg: #e8e8e8;
      --card-bg: #1c1e24;
      --border: #33363d;
      --accent: #60a5fa;
      --warn-bg: #2a1d10;
      --warn-border: #ea580c;
      --warn-fg: #fdba74;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121317;
    --fg: #e8e8e8;
    --card-bg: #1c1e24;
    --border: #33363d;
    --accent: #60a5fa;
    --warn-bg: #2a1d10;
    --warn-border: #ea580c;
    --warn-fg: #fdba74;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Segoe UI", sans-serif;
    line-height: 1.7;
    margin: 0;
    padding: 2rem 1rem 4rem;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin-bottom: 0.3rem; }
  .timestamp { color: #888; font-size: 0.9rem; margin-bottom: 1.5rem; }
  .banner {
    background: var(--warn-bg);
    border: 1px solid var(--warn-border);
    color: var(--warn-fg);
    border-radius: 10px;
    padding: 1rem 1.2rem;
    font-weight: 600;
    margin-bottom: 1.5rem;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.2rem 1.4rem;
  }
  .disclaimer {
    margin-top: 2rem;
    font-size: 0.85rem;
    color: #888;
    border-top: 1px solid var(--border);
    padding-top: 1rem;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>デイリー・ポートフォリオレポート 2026-08-25</h1>
  <div class="timestamp">生成開始 07:03 JST</div>
  <div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
  <div class="card">
    価格データの読み込みと分析を実行しています。完了までしばらくお待ちください。
  </div>
  <div class="disclaimer">
    これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。
  </div>
</div>
</body>
</html>
