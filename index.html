<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-08-10</title>
<style>
  :root {
    --bg: #f5f6f8;
    --fg: #1a1d23;
    --card-bg: #ffffff;
    --border: #dfe3e8;
    --accent: #b45309;
    --muted: #5c6470;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161a;
      --fg: #e8eaed;
      --card-bg: #1e2126;
      --border: #333844;
      --accent: #fbbf24;
      --muted: #9aa2b1;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161a;
    --fg: #e8eaed;
    --card-bg: #1e2126;
    --border: #333844;
    --accent: #fbbf24;
    --muted: #9aa2b1;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    max-width: 720px;
    margin: 0 auto;
    padding: 2rem 1.25rem;
    line-height: 1.7;
  }
  h1 { font-size: 1.4rem; }
  .banner {
    background: var(--card-bg);
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 1rem;
    border-radius: 8px;
    font-weight: bold;
    margin: 1rem 0;
  }
  .timestamp { color: var(--muted); font-size: 0.9rem; }
  .disclaimer {
    margin-top: 2rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.85rem;
  }
</style>
</head>
<body>
<h1>デイリー・ポートフォリオレポート 2026-08-10</h1>
<p class="timestamp">生成開始 2026-08-10 07:03 JST</p>
<div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
<p class="disclaimer">これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。</p>
</body>
</html>
