<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-08-13</title>
<style>
  :root {
    --bg: #f7f7f5;
    --card-bg: #ffffff;
    --text: #1a1a1a;
    --muted: #666666;
    --border: #e0e0e0;
    --accent: #2563eb;
    --warn-bg: #fff8e1;
    --warn-border: #f0c419;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --text: #e8e8e8;
      --muted: #a0a0a0;
      --border: #333333;
      --accent: #60a5fa;
      --warn-bg: #3a2f0a;
      --warn-border: #caa316;
    }
  }
  [data-theme="dark"] {
    --bg: #121212;
    --card-bg: #1e1e1e;
    --text: #e8e8e8;
    --muted: #a0a0a0;
    --border: #333333;
    --accent: #60a5fa;
    --warn-bg: #3a2f0a;
    --warn-border: #caa316;
  }
  [data-theme="light"] {
    --bg: #f7f7f5;
    --card-bg: #ffffff;
    --text: #1a1a1a;
    --muted: #666666;
    --border: #e0e0e0;
    --accent: #2563eb;
    --warn-bg: #fff8e1;
    --warn-border: #f0c419;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem 1rem;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    line-height: 1.7;
  }
  .container { max-width: 800px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin-bottom: 0.3rem; }
  .timestamp { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
  .banner {
    background: var(--warn-bg);
    border: 1px solid var(--warn-border);
    border-radius: 8px;
    padding: 1rem 1.2rem;
    margin: 1.5rem 0;
    font-weight: 600;
  }
  .disclaimer {
    margin-top: 2.5rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
    font-size: 0.85rem;
    color: var(--muted);
  }
</style>
</head>
<body>
<div class="container">
  <h1>デイリー・ポートフォリオレポート 2026-08-13</h1>
  <div class="timestamp">生成開始 2026-08-13 07:03 JST</div>
  <div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
  <div class="disclaimer">これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。</div>
</div>
</body>
</html>
