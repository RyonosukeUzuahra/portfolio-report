<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-09-22</title>
<style>
  :root {
    --bg: #f7f8fa; --fg: #1a1a2e; --card-bg: #ffffff; --border: #d0d5dd;
    --accent: #2563eb; --warn-bg: #fff7e6; --warn-border: #f59e0b; --warn-fg: #92400e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161f; --fg: #e6e6f0; --card-bg: #1e2130; --border: #3a3d52;
      --accent: #60a5fa; --warn-bg: #3a2e10; --warn-border: #d69e2e; --warn-fg: #fde68a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161f; --fg: #e6e6f0; --card-bg: #1e2130; --border: #3a3d52;
    --accent: #60a5fa; --warn-bg: #3a2e10; --warn-border: #d69e2e; --warn-fg: #fde68a;
  }
  body { background: var(--bg); color: var(--fg); font-family: "Hiragino Sans", "Yu Gothic", -apple-system, sans-serif; margin: 0; padding: 24px 16px; line-height: 1.7; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .timestamp { color: var(--fg); opacity: 0.7; font-size: 0.9rem; margin-bottom: 20px; }
  .banner { background: var(--warn-bg); border: 1px solid var(--warn-border); color: var(--warn-fg); padding: 16px; border-radius: 8px; font-weight: bold; max-width: 720px; }
  .disclaimer { margin-top: 32px; font-size: 0.85rem; opacity: 0.75; max-width: 720px; }
</style>
</head>
<body>
  <h1>デイリー・ポートフォリオレポート 2026-09-22</h1>
  <div class="timestamp">生成開始 07:02 JST</div>
  <div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
  <div class="disclaimer">これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。</div>
</body>
</html>
