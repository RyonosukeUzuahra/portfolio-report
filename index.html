<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-11-08</title>
<style>
:root{
  --bg:#f7f8fa; --fg:#1a1a1a; --card-bg:#ffffff; --border:#e2e5e9; --muted:#6b7280;
  --banner-warn-bg:#fff8e1; --banner-warn-border:#f0b429;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1117; --fg:#e6edf3; --card-bg:#161b22; --border:#30363d; --muted:#9198a1;
    --banner-warn-bg:#3a2f0b; --banner-warn-border:#f0b429;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1117; --fg:#e6edf3; --card-bg:#161b22; --border:#30363d; --muted:#9198a1;
  --banner-warn-bg:#3a2f0b; --banner-warn-border:#f0b429;
}
*{box-sizing:border-box;}
body{
  background:var(--bg); color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;
  margin:0; padding:0 0 40px; line-height:1.65; font-size:15px;
}
.wrap{max-width:1100px; margin:0 auto; padding:0 14px;}
h1{font-size:1.5rem; margin:20px 0 4px;}
.timestamp{color:var(--muted); font-size:0.88rem; margin-bottom:14px;}
.banner{border-radius:8px; padding:12px 16px; margin:10px 0; font-size:0.95rem;}
.banner-warn{background:var(--banner-warn-bg); border:1px solid var(--banner-warn-border);}
.disclaimer{font-size:0.82rem; color:var(--muted); border-top:1px solid var(--border); padding-top:12px; margin-top:28px;}
</style>
</head>
<body>
<div class="wrap">
<h1>デイリー・ポートフォリオレポート 2026-11-08</h1>
<div class="timestamp">生成開始 2026-11-08 07:44 JST</div>
<div class="banner banner-warn">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
<div class="disclaimer">これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。</div>
</div>
</body>
</html>
