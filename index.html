<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-09-01</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --fg: #0f172a;
    --card-bg: #ffffff;
    --border: #e2e8f0;
    --accent: #ea580c;
    --muted: #64748b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f172a;
      --fg: #e2e8f0;
      --card-bg: #1e293b;
      --border: #334155;
      --muted: #94a3b8;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f172a;
    --fg: #e2e8f0;
    --card-bg: #1e293b;
    --border: #334155;
    --muted: #94a3b8;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Hiragino Sans", "Yu Gothic", "Segoe UI", sans-serif;
    margin: 0;
    padding: 24px;
    line-height: 1.7;
  }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .timestamp { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
  .banner {
    background: var(--card-bg);
    border: 1px solid var(--accent);
    border-left: 6px solid var(--accent);
    border-radius: 8px;
    padding: 16px 20px;
    margin: 20px 0;
    font-size: 1.05rem;
  }
  .disclaimer {
    margin-top: 40px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.85rem;
  }
</style>
</head>
<body>
  <h1>デイリー・ポートフォリオレポート 2026-09-01</h1>
  <div class="timestamp">生成開始 07:05 JST</div>
  <div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
  <div class="disclaimer">
    これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。
  </div>
</body>
</html>
