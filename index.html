<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-08-01</title>
<style>
  :root {
    --bg: #f7f8fa;
    --fg: #1a1d23;
    --card-bg: #ffffff;
    --border: #e2e5ea;
    --muted: #6b7280;
    --accent: #2563eb;
    --banner-bg: #fff8e1;
    --banner-fg: #8a6d00;
    --banner-border: #f0d878;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --fg: #e6e8eb;
      --card-bg: #1d2026;
      --border: #2c3038;
      --muted: #9aa1ac;
      --accent: #6ea8ff;
      --banner-bg: #2b2410;
      --banner-fg: #f0d878;
      --banner-border: #55480f;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161a; --fg: #e6e8eb; --card-bg: #1d2026; --border: #2c3038;
    --muted: #9aa1ac; --accent: #6ea8ff; --banner-bg: #2b2410; --banner-fg: #f0d878; --banner-border: #55480f;
  }
  :root[data-theme="light"] {
    --bg: #f7f8fa; --fg: #1a1d23; --card-bg: #ffffff; --border: #e2e5ea;
    --muted: #6b7280; --accent: #2563eb; --banner-bg: #fff8e1; --banner-fg: #8a6d00; --banner-border: #f0d878;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 64px;
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    line-height: 1.7;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .timestamp { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
  .banner {
    background: var(--banner-bg); color: var(--banner-fg);
    border: 1px solid var(--banner-border); border-radius: 10px;
    padding: 16px; font-weight: 600; font-size: 1.05rem; margin-bottom: 24px;
  }
  .card {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px; margin-bottom: 16px;
  }
  .disclaimer { color: var(--muted); font-size: 0.85rem; margin-top: 32px; border-top: 1px solid var(--border); padding-top: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>デイリー・ポートフォリオレポート 2026-08-01</h1>
  <div class="timestamp">生成開始 2026-08-01 08:32 JST</div>
  <div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
  <div class="card">
    価格の取得・分析処理を実行中です。完了次第、本ページは保有銘柄・ウォッチリストの詳細レポートに自動的に置き換わります。
  </div>
  <div class="disclaimer">
    これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。
  </div>
</div>
</body>
</html>
