<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>デイリー・ポートフォリオレポート 2026-08-19</title>
<style>
  :root {
    --bg: #f5f6f8;
    --fg: #1a1c20;
    --card-bg: #ffffff;
    --border: #dde1e6;
    --accent: #2563eb;
    --banner-bg: #fff7e6;
    --banner-border: #f5b544;
    --muted: #5b6270;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161a;
      --fg: #e8eaed;
      --card-bg: #1e2126;
      --border: #33373f;
      --accent: #6ea8fe;
      --banner-bg: #3a2f12;
      --banner-border: #caa23a;
      --muted: #9aa2b1;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161a;
    --fg: #e8eaed;
    --card-bg: #1e2126;
    --border: #33373f;
    --accent: #6ea8fe;
    --banner-bg: #3a2f12;
    --banner-border: #caa23a;
    --muted: #9aa2b1;
  }
  body {
    margin: 0;
    padding: 2rem 1rem;
    background: var(--bg);
    color: var(--fg);
    font-family: "Hiragino Sans", "Yu Gothic", system-ui, -apple-system, sans-serif;
    line-height: 1.7;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin-bottom: 0.3rem; }
  .timestamp { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
  .banner {
    background: var(--banner-bg);
    border: 1px solid var(--banner-border);
    border-radius: 8px;
    padding: 1rem 1.25rem;
    font-weight: 600;
    margin-bottom: 1.5rem;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1rem 1.25rem;
    margin-bottom: 1rem;
  }
  .disclaimer {
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 2rem;
    border-top: 1px solid var(--border);
    padding-top: 1rem;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>デイリー・ポートフォリオレポート 2026-08-19</h1>
  <div class="timestamp">生成開始 2026-08-19 07:03 JST</div>
  <div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
  <div class="card">
    価格データの取得・分析・仮想オートマティック取引セクションの生成を進めています。しばらくお待ちください。
  </div>
  <div class="disclaimer">
    これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。
  </div>
</div>
</body>
</html>
