<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>デイリー・ポートフォリオレポート 2026-09-09</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --fg: #0f172a;
    --card: #ffffff;
    --border: #e2e8f0;
    --accent: #2563eb;
    --warn-bg: #fef3c7;
    --warn-fg: #92400e;
    --warn-border: #f59e0b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f172a;
      --fg: #e2e8f0;
      --card: #1e293b;
      --border: #334155;
      --accent: #60a5fa;
      --warn-bg: #451a03;
      --warn-fg: #fde68a;
      --warn-border: #b45309;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f172a;
    --fg: #e2e8f0;
    --card: #1e293b;
    --border: #334155;
    --accent: #60a5fa;
    --warn-bg: #451a03;
    --warn-fg: #fde68a;
    --warn-border: #b45309;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    margin: 0;
    padding: 24px 16px 60px;
    line-height: 1.7;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .timestamp { color: var(--fg); opacity: 0.7; font-size: 0.9rem; margin-bottom: 20px; }
  .banner {
    background: var(--warn-bg);
    color: var(--warn-fg);
    border: 1px solid var(--warn-border);
    border-radius: 8px;
    padding: 16px 18px;
    font-size: 1.05rem;
    font-weight: 600;
    margin-bottom: 24px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 18px;
    margin-bottom: 16px;
  }
  .disclaimer {
    font-size: 0.85rem;
    opacity: 0.75;
    border-top: 1px solid var(--border);
    padding-top: 14px;
    margin-top: 24px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>デイリー・ポートフォリオレポート 2026-09-09</h1>
  <div class="timestamp">生成開始 07:04 JST</div>
  <div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
  <div class="card">
    価格データ・テクニカル指標・セクター分析・ニュース収集・仮想オートマティック取引セクションを順次生成しています。しばらくお待ちください。
  </div>
  <div class="disclaimer">
    これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。
  </div>
</div>
</body>
</html>
