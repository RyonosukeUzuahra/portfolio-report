<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-09-20</title>
<style>
:root {
  --bg: #f7f8fa; --fg: #1a1d23; --card-bg: #ffffff; --border: #e2e5ea;
  --accent: #2563eb; --muted: #6b7280; --banner-bg: #fff7e6; --banner-border: #f0b429;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14161a; --fg: #e6e8eb; --card-bg: #1e2126; --border: #30343b;
    --accent: #60a5fa; --muted: #9aa1ac; --banner-bg: #3a2f14; --banner-border: #b8860b;
  }
}
:root[data-theme="dark"] {
  --bg: #14161a; --fg: #e6e8eb; --card-bg: #1e2126; --border: #30343b;
  --accent: #60a5fa; --muted: #9aa1ac; --banner-bg: #3a2f14; --banner-border: #b8860b;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Segoe UI", sans-serif;
  margin: 0; padding: 0 12px 40px; line-height: 1.7; font-size: 15px;
}
.wrap { max-width: 900px; margin: 0 auto; }
h1 { font-size: 1.35rem; margin: 20px 0 4px; }
.timestamp { color: var(--muted); font-size: 0.88rem; margin-bottom: 14px; }
.banner {
  background: var(--banner-bg); border: 1px solid var(--banner-border); border-radius: 8px;
  padding: 14px 18px; font-size: 1rem; margin-bottom: 16px; font-weight: 600;
}
.disclaimer {
  margin: 18px 0; padding: 12px 16px; border: 1px dashed var(--border); border-radius: 8px;
  color: var(--muted); font-size: 0.85rem; background: var(--card-bg);
}
</style>
</head>
<body>
<div class="wrap">

<h1>デイリー・ポートフォリオレポート 2026-09-20</h1>
<div class="timestamp">生成開始 07:02 JST</div>

<div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>

<div class="disclaimer">
これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。
</div>

</div>
</body>
</html>
