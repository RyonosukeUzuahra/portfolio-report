<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-08-17</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card-bg: #ffffff;
    --text: #1a1d23;
    --muted: #5b6472;
    --border: #e1e4e9;
    --accent: #2563eb;
    --warn-bg: #fff8e1;
    --warn-border: #f2c94c;
    --warn-text: #7a5c00;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171c;
      --card-bg: #1c2027;
      --text: #e8eaed;
      --muted: #9aa4b2;
      --border: #2c313a;
      --accent: #6ea8fe;
      --warn-bg: #3a3110;
      --warn-border: #c9a227;
      --warn-text: #f2d97a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14171c;
    --card-bg: #1c2027;
    --text: #e8eaed;
    --muted: #9aa4b2;
    --border: #2c313a;
    --accent: #6ea8fe;
    --warn-bg: #3a3110;
    --warn-border: #c9a227;
    --warn-text: #f2d97a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 64px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    line-height: 1.7;
  }
  .container { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .timestamp { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
  .banner {
    background: var(--warn-bg);
    border: 1px solid var(--warn-border);
    color: var(--warn-text);
    border-radius: 10px;
    padding: 16px 18px;
    font-size: 1.05rem;
    font-weight: 600;
    margin-bottom: 24px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 16px;
  }
  .disclaimer {
    margin-top: 32px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.85rem;
  }
</style>
</head>
<body>
<div class="container">
  <h1>デイリー・ポートフォリオレポート 2026-08-17</h1>
  <div class="timestamp">生成開始 2026-08-17 08:51 JST</div>
  <div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
  <div class="card">
    価格データの取得・分析・レポート本文を作成中です。しばらくお待ちください。
  </div>
  <div class="disclaimer">
    これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。
  </div>
</div>
</body>
</html>
