<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-08-09</title>
<style>
  :root {
    --bg: #f7f7f8;
    --fg: #1a1a1a;
    --card-bg: #ffffff;
    --border: #e0e0e0;
    --accent: #b45309;
    --muted: #666666;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --fg: #e8e8e8;
      --card-bg: #1e2126;
      --border: #33363c;
      --accent: #f2b545;
      --muted: #a0a0a0;
    }
  }
  [data-theme="dark"] {
    --bg: #14161a;
    --fg: #e8e8e8;
    --card-bg: #1e2126;
    --border: #33363c;
    --accent: #f2b545;
    --muted: #a0a0a0;
  }
  [data-theme="light"] {
    --bg: #f7f7f8;
    --fg: #1a1a1a;
    --card-bg: #ffffff;
    --border: #e0e0e0;
    --accent: #b45309;
    --muted: #666666;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 16px;
    line-height: 1.7;
  }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .timestamp { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
  .banner {
    background: var(--card-bg);
    border: 1px solid var(--accent);
    border-left: 5px solid var(--accent);
    border-radius: 6px;
    padding: 16px;
    font-size: 1.05rem;
    margin-bottom: 24px;
  }
  .disclaimer {
    margin-top: 32px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: 0.85rem;
    color: var(--muted);
  }
</style>
</head>
<body>
<h1>デイリー・ポートフォリオレポート 2026-08-09</h1>
<div class="timestamp">生成開始 07:04 JST</div>
<div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
<div class="disclaimer">これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。</div>
</body>
</html>
