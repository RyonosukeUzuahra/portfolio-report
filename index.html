<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-09-29</title>
<style>
  :root {
    --bg: #f7f7f9;
    --fg: #1a1a1a;
    --card-bg: #ffffff;
    --border: #e0e0e5;
    --banner-bg: #fff8e1;
    --banner-fg: #7a5c00;
    --muted: #666;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121214;
      --fg: #eaeaea;
      --card-bg: #1c1c1f;
      --border: #333338;
      --banner-bg: #3a2f00;
      --banner-fg: #ffd966;
      --muted: #999;
    }
  }
  [data-theme="light"] {
    --bg: #f7f7f9; --fg: #1a1a1a; --card-bg: #ffffff; --border: #e0e0e5;
    --banner-bg: #fff8e1; --banner-fg: #7a5c00; --muted: #666;
  }
  [data-theme="dark"] {
    --bg: #121214; --fg: #eaeaea; --card-bg: #1c1c1f; --border: #333338;
    --banner-bg: #3a2f00; --banner-fg: #ffd966; --muted: #999;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    margin: 0;
    padding: 24px 16px;
    line-height: 1.6;
  }
  .container { max-width: 800px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .timestamp { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
  .banner {
    background: var(--banner-bg);
    color: var(--banner-fg);
    border-radius: 8px;
    padding: 16px 20px;
    font-weight: 600;
    margin-bottom: 20px;
    border: 1px solid var(--border);
  }
  .disclaimer {
    margin-top: 32px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.85rem;
  }
</style>
</head>
<body>
<div class="container">
  <h1>デイリー・ポートフォリオレポート 2026-09-29</h1>
  <div class="timestamp">生成開始 07:04 JST</div>
  <div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
  <div class="disclaimer">これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。</div>
</div>
</body>
</html>
