<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-11-01</title>
<style>
  :root {
    --bg: #f8fafc;
    --fg: #0f172a;
    --card-bg: #ffffff;
    --border: #e2e8f0;
    --banner-bg: #fef3c7;
    --banner-fg: #92400e;
    --muted: #64748b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --fg: #e2e8f0;
      --card-bg: #1e293b;
      --border: #334155;
      --banner-bg: #78350f;
      --banner-fg: #fde68a;
      --muted: #94a3b8;
    }
  }
  :root[data-theme="light"] {
    --bg: #f8fafc; --fg: #0f172a; --card-bg: #ffffff; --border: #e2e8f0; --banner-bg: #fef3c7; --banner-fg: #92400e; --muted: #64748b;
  }
  :root[data-theme="dark"] {
    --bg: #0f172a; --fg: #e2e8f0; --card-bg: #1e293b; --border: #334155; --banner-bg: #78350f; --banner-fg: #fde68a; --muted: #94a3b8;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    margin: 0;
    padding: 24px 16px;
    line-height: 1.7;
  }
  .container { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .timestamp { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
  .banner {
    background: var(--banner-bg);
    color: var(--banner-fg);
    border-radius: 10px;
    padding: 16px 18px;
    font-weight: 600;
    font-size: 1.05rem;
    margin-bottom: 20px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 16px;
  }
  .disclaimer { color: var(--muted); font-size: 0.85rem; margin-top: 24px; border-top: 1px solid var(--border); padding-top: 16px; }
</style>
</head>
<body>
<div class="container">
  <h1>デイリー・ポートフォリオレポート 2026-11-01</h1>
  <div class="timestamp">生成開始 2026-11-01 07:03 JST</div>
  <div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
  <div class="card">
    本日は日本時間11月1日(日)のため、取引所は休場です。レポートは直近の確定済み取引セッションのデータに基づいて生成されます。しばらくお待ちください。
  </div>
  <div class="disclaimer">
    これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。
  </div>
</div>
</body>
</html>
