<html lang="ja">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-08-30</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --fg: #1f2328; --muted: #57606a; --line: #d0d7de; --card: #f6f8fa;
    --warn-bg: #fff8c5; --warn-fg: #7d4e00; --warn-line: #d4a72c;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --line: #30363d; --card: #161b22;
      --warn-bg: #3b2f00; --warn-fg: #f2cc60; --warn-line: #9e7b00;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --line: #30363d; --card: #161b22;
    --warn-bg: #3b2f00; --warn-fg: #f2cc60; --warn-line: #9e7b00;
  }
  body { background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif; margin: 0; padding: 1.5rem; line-height: 1.7; }
  h1 { font-size: 1.4rem; margin-bottom: 0.3rem; }
  .ts { color: var(--muted); font-size: 0.9rem; margin-bottom: 1rem; }
  .banner { background: var(--warn-bg); color: var(--warn-fg); border: 1px solid var(--warn-line); border-radius: 8px; padding: 1rem 1.2rem; margin: 1rem 0; font-weight: 600; }
  .disclaimer { color: var(--muted); font-size: 0.85rem; margin-top: 2rem; border-top: 1px solid var(--line); padding-top: 1rem; }
</style>
</head>
<body>

</body>
</html>
