<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-11-11</title>
<style>
  :root {
    --bg: #f8fafc; --fg: #0f172a; --card: #ffffff; --border: #e2e8f0; --banner-bg: #fef9c3; --banner-fg: #854d0e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f172a; --fg: #e2e8f0; --card: #1e293b; --border: #334155; --banner-bg: #422006; --banner-fg: #fde68a; }
  }
  :root[data-theme="light"] { --bg: #f8fafc; --fg: #0f172a; --card: #ffffff; --border: #e2e8f0; --banner-bg: #fef9c3; --banner-fg: #854d0e; }
  :root[data-theme="dark"] { --bg: #0f172a; --fg: #e2e8f0; --card: #1e293b; --border: #334155; --banner-bg: #422006; --banner-fg: #fde68a; }
  body { background: var(--bg); color: var(--fg); font-family: -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif; margin: 0; padding: 24px; line-height: 1.7; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; max-width: 800px; margin: 0 auto 16px; }
  .banner { background: var(--banner-bg); color: var(--banner-fg); border-radius: 8px; padding: 14px 18px; font-weight: bold; text-align: center; max-width: 800px; margin: 0 auto 16px; }
  h1 { font-size: 1.4rem; }
  .timestamp { color: #64748b; font-size: 0.9rem; }
  .disclaimer { font-size: 0.85rem; color: #64748b; max-width: 800px; margin: 16px auto; }
</style>
</head>
<body>
  <div class="card">
    <h1>デイリー・ポートフォリオレポート 2026-11-11</h1>
    <div class="timestamp">生成開始 2026-11-11 07:39 JST</div>
  </div>
  <div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
  <div class="disclaimer">これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。</div>
</body>
</html>
