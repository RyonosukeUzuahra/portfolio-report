<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-10-17</title>
<style>
  :root {
    --bg: #f5f7fa;
    --card-bg: #ffffff;
    --text: #1a1a1a;
    --muted: #666;
    --border: #e0e4e8;
    --accent: #2563eb;
    --warn-bg: #fff7e6;
    --warn-border: #f0b429;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --card-bg: #1a1d24;
      --text: #e8e8e8;
      --muted: #999;
      --border: #2a2d35;
      --accent: #60a5fa;
      --warn-bg: #2a2410;
      --warn-border: #9a7b1f;
    }
  }
  :root[data-theme="light"] {
    --bg: #f5f7fa; --card-bg: #ffffff; --text: #1a1a1a; --muted: #666;
    --border: #e0e4e8; --accent: #2563eb; --warn-bg: #fff7e6; --warn-border: #f0b429;
  }
  :root[data-theme="dark"] {
    --bg: #0f1115; --card-bg: #1a1d24; --text: #e8e8e8; --muted: #999;
    --border: #2a2d35; --accent: #60a5fa; --warn-bg: #2a2410; --warn-border: #9a7b1f;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    margin: 0;
    padding: 24px 16px;
    line-height: 1.7;
  }
  .container { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .timestamp { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
  .banner {
    background: var(--warn-bg);
    border: 1px solid var(--warn-border);
    border-radius: 8px;
    padding: 16px;
    font-size: 1.05rem;
    font-weight: 600;
    margin-bottom: 20px;
  }
  .disclaimer {
    margin-top: 32px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.85rem;
  }
</style>
</head>
<body>
<div class="container">
  <h1>デイリー・ポートフォリオレポート 2026-10-17</h1>
  <div class="timestamp">生成開始 07:04 JST</div>
  <div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
  <div class="disclaimer">これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。</div>
</div>
</body>
</html>
