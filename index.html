<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-08-03</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --card-bg: #f5f5f7;
    --border: #ddd;
    --banner-bg: #fff8e1;
    --banner-border: #f0c419;
    --muted: #666;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111214;
      --fg: #e8e8e8;
      --card-bg: #1c1d20;
      --border: #333;
      --banner-bg: #3a2f0b;
      --banner-border: #a97c1c;
      --muted: #aaa;
    }
  }
  :root[data-theme="light"] {
    --bg: #ffffff; --fg: #1a1a1a; --card-bg: #f5f5f7; --border: #ddd;
    --banner-bg: #fff8e1; --banner-border: #f0c419; --muted: #666;
  }
  :root[data-theme="dark"] {
    --bg: #111214; --fg: #e8e8e8; --card-bg: #1c1d20; --border: #333;
    --banner-bg: #3a2f0b; --banner-border: #a97c1c; --muted: #aaa;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    max-width: 900px;
    margin: 0 auto;
    padding: 24px 16px 60px;
    line-height: 1.7;
  }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .timestamp { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
  .banner {
    background: var(--banner-bg);
    border: 1px solid var(--banner-border);
    border-radius: 8px;
    padding: 16px;
    font-size: 1.1rem;
    font-weight: 600;
    margin-bottom: 24px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .disclaimer {
    margin-top: 40px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.85rem;
  }
</style>
</head>
<body>
  <h1>デイリー・ポートフォリオレポート 2026-08-03</h1>
  <div class="timestamp">生成開始 2026-08-03 03:07 JST</div>
  <div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
  <div class="card">
    保有銘柄・ウォッチリストの価格確認とニュース分析を実行中です。生成が完了すると、この画面は詳細なレポートに自動的に置き換わります。
  </div>
  <div class="disclaimer">
    これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。
  </div>
</body>
</html>
