<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-10-05</title>
<style>
  :root {
    --bg: #f7f7f8;
    --fg: #1a1a1a;
    --card-bg: #ffffff;
    --border: #e2e2e4;
    --accent: #2563eb;
    --warn-bg: #fff7e6;
    --warn-border: #f0b429;
    --muted: #6b7280;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212;
      --fg: #e6e6e6;
      --card-bg: #1e1e1e;
      --border: #333333;
      --accent: #60a5fa;
      --warn-bg: #3a2f10;
      --warn-border: #f0b429;
      --muted: #9ca3af;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121212;
    --fg: #e6e6e6;
    --card-bg: #1e1e1e;
    --border: #333333;
    --accent: #60a5fa;
    --warn-bg: #3a2f10;
    --warn-border: #f0b429;
    --muted: #9ca3af;
  }
  :root[data-theme="light"] {
    --bg: #f7f7f8;
    --fg: #1a1a1a;
    --card-bg: #ffffff;
    --border: #e2e2e4;
    --accent: #2563eb;
    --warn-bg: #fff7e6;
    --warn-border: #f0b429;
    --muted: #6b7280;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    margin: 0;
    padding: 24px 16px;
    line-height: 1.7;
  }
  .container { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .timestamp { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
  .banner {
    background: var(--warn-bg);
    border: 1px solid var(--warn-border);
    border-radius: 8px;
    padding: 16px;
    font-size: 1.05rem;
    margin-bottom: 20px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .disclaimer { color: var(--muted); font-size: 0.85rem; margin-top: 24px; border-top: 1px solid var(--border); padding-top: 12px; }
</style>
</head>
<body>
<div class="container">
  <h1>デイリー・ポートフォリオレポート 2026-10-05</h1>
  <div class="timestamp">生成開始 2026-10-05 07:03 JST</div>
  <div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
  <div class="card">
    <p>現在、保有銘柄・ウォッチリストの価格確認、テクニカル分析、セクター配分、デイリー/ウィークリーのシグナル判定、仮想オートマティック取引セクションなどを順次生成しています。しばらくお待ちください。</p>
  </div>
  <div class="disclaimer">
    これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。
  </div>
</div>
</body>
</html>
