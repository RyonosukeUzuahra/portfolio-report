<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-10-21</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a1a;
    --card-bg: #f5f5f7;
    --border: #d0d0d5;
    --banner-bg: #fff3cd;
    --banner-fg: #7a5a00;
    --muted: #666;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212;
      --fg: #e8e8e8;
      --card-bg: #1e1e20;
      --border: #3a3a3d;
      --banner-bg: #3a2f00;
      --banner-fg: #ffd866;
      --muted: #999;
    }
  }
  html[data-theme="light"] {
    --bg: #ffffff; --fg: #1a1a1a; --card-bg: #f5f5f7; --border: #d0d0d5;
    --banner-bg: #fff3cd; --banner-fg: #7a5a00; --muted: #666;
  }
  html[data-theme="dark"] {
    --bg: #121212; --fg: #e8e8e8; --card-bg: #1e1e20; --border: #3a3a3d;
    --banner-bg: #3a2f00; --banner-fg: #ffd866; --muted: #999;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    margin: 0;
    padding: 24px 16px 60px;
    line-height: 1.7;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .timestamp { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
  .banner {
    background: var(--banner-bg);
    color: var(--banner-fg);
    border-radius: 10px;
    padding: 16px 20px;
    font-size: 1.05rem;
    font-weight: 600;
    margin-bottom: 24px;
  }
  .disclaimer {
    margin-top: 40px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.85rem;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>デイリー・ポートフォリオレポート 2026-10-21</h1>
    <div class="timestamp">生成開始 2026-10-21 07:03 JST</div>
    <div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
    <div class="disclaimer">
      これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。
    </div>
  </div>
</body>
</html>
