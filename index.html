<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-08-04</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f9;
    --fg: #1a1a1e;
    --card-bg: #ffffff;
    --border: #e0e0e6;
    --accent: #b45309;
    --muted: #6b7280;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a;
      --fg: #e8e8ec;
      --card-bg: #1f1f24;
      --border: #33333a;
      --accent: #fbbf24;
      --muted: #9ca3af;
    }
  }
  :root[data-theme="light"] {
    --bg: #f7f7f9; --fg: #1a1a1e; --card-bg: #ffffff; --border: #e0e0e6; --accent: #b45309; --muted: #6b7280;
  }
  :root[data-theme="dark"] {
    --bg: #16161a; --fg: #e8e8ec; --card-bg: #1f1f24; --border: #33333a; --accent: #fbbf24; --muted: #9ca3af;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    max-width: 720px;
    margin: 0 auto;
    padding: 2rem 1.25rem;
    line-height: 1.7;
  }
  h1 {
    font-size: 1.4rem;
    margin-bottom: 0.25rem;
  }
  .timestamp {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 1.5rem;
  }
  .banner {
    background: var(--card-bg);
    border: 1px solid var(--accent);
    border-left: 6px solid var(--accent);
    border-radius: 8px;
    padding: 1rem 1.25rem;
    margin-bottom: 1.5rem;
    font-weight: 600;
  }
  .disclaimer {
    margin-top: 2rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.85rem;
  }
</style>
</head>
<body>
  <h1>デイリー・ポートフォリオレポート 2026-08-04</h1>
  <div class="timestamp">生成開始 03:07 JST</div>
  <div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
  <div class="disclaimer">
    これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。
  </div>
</body>
</html>
