<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-10-24</title>
<style>
  :root {
    --bg: #f7f8fa;
    --fg: #1a1a1a;
    --card-bg: #ffffff;
    --border: #e2e5e9;
    --banner-bg: #fff8e1;
    --banner-border: #f5c518;
    --muted: #6b7280;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121417;
      --fg: #e8e8e8;
      --card-bg: #1c1f24;
      --border: #333843;
      --banner-bg: #332b00;
      --banner-border: #997a00;
      --muted: #9aa3af;
    }
  }
  :root[data-theme="light"] {
    --bg: #f7f8fa; --fg: #1a1a1a; --card-bg: #ffffff; --border: #e2e5e9; --banner-bg: #fff8e1; --banner-border: #f5c518; --muted: #6b7280;
  }
  :root[data-theme="dark"] {
    --bg: #121417; --fg: #e8e8e8; --card-bg: #1c1f24; --border: #333843; --banner-bg: #332b00; --banner-border: #997a00; --muted: #9aa3af;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    margin: 0;
    padding: 24px 16px;
    line-height: 1.6;
  }
  .container {
    max-width: 800px;
    margin: 0 auto;
  }
  h1 {
    font-size: 1.5rem;
    margin-bottom: 4px;
  }
  .timestamp {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 20px;
  }
  .banner {
    background: var(--banner-bg);
    border: 1px solid var(--banner-border);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 20px;
    font-weight: 600;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .disclaimer {
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 24px;
    border-top: 1px solid var(--border);
    padding-top: 12px;
  }
</style>
</head>
<body>
<div class="container">
  <h1>デイリー・ポートフォリオレポート 2026-10-24</h1>
  <div class="timestamp">生成開始 07:03 JST</div>
  <div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
  <div class="card">
    <p>本レポートはシステムにより自動生成されています。価格データの読み込みと分析処理を実行中です。しばらくお待ちいただくか、ページを再読み込みしてください。</p>
  </div>
  <div class="disclaimer">
    これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。
  </div>
</div>
</body>
</html>
