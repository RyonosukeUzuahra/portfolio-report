<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>デイリー・ポートフォリオレポート 2026-10-16</title>
<style>
  :root {
    --bg: #f7f7f9;
    --fg: #1a1a1a;
    --card-bg: #ffffff;
    --border: #e2e2e7;
    --banner-bg: #fff8e1;
    --banner-fg: #8a6d00;
    --muted: #6b7280;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121214;
      --fg: #ececec;
      --card-bg: #1c1c1f;
      --border: #2e2e33;
      --banner-bg: #3a2f00;
      --banner-fg: #ffd866;
      --muted: #9aa0a6;
    }
  }
  :root[data-theme="light"] {
    --bg: #f7f7f9; --fg: #1a1a1a; --card-bg: #ffffff; --border: #e2e2e7; --banner-bg: #fff8e1; --banner-fg: #8a6d00; --muted: #6b7280;
  }
  :root[data-theme="dark"] {
    --bg: #121214; --fg: #ececec; --card-bg: #1c1c1f; --border: #2e2e33; --banner-bg: #3a2f00; --banner-fg: #ffd866; --muted: #9aa0a6;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    margin: 0;
    padding: 24px 16px;
    line-height: 1.6;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .timestamp { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
  .banner {
    background: var(--banner-bg);
    color: var(--banner-fg);
    border-radius: 10px;
    padding: 16px 18px;
    font-weight: 600;
    margin-bottom: 20px;
  }
  .disclaimer {
    color: var(--muted);
    font-size: 0.85rem;
    border-top: 1px solid var(--border);
    padding-top: 16px;
    margin-top: 32px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>デイリー・ポートフォリオレポート 2026-10-16</h1>
    <div class="timestamp">生成開始 2026-10-16 07:02 JST</div>
    <div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
    <div class="disclaimer">
      これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。
    </div>
  </div>
</body>
</html>
