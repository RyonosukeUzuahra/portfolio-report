    --banner-bg: #3a2e05; --banner-border: #f59e0b;
  }
  body { background: var(--bg); color: var(--fg); font-family: -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif; margin: 0; padding: 24px 16px; line-height: 1.7; }
  .container { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.4rem; }
  .timestamp { color: #888; font-size: 0.9rem; }
  .banner { background: var(--banner-bg); border: 1px solid var(--banner-border); border-radius: 8px; padding: 16px; margin: 16px 0; font-weight: bold; }
  .disclaimer { font-size: 0.85rem; color: #888; border-top: 1px solid var(--border); padding-top: 12px; margin-top: 24px; }
