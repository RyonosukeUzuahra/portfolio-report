<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-09-27</title>
<style>
  :root {
    --bg: #f7f7fa;
    --fg: #1a1a1a;
    --card-bg: #ffffff;
    --border: #ddd;
    --banner-bg: #fff3cd;
    --banner-fg: #7a5b00;
    --muted: #666;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --fg: #e8e8ea;
      --card-bg: #1e2126;
      --border: #333;
      --banner-bg: #3a2f00;
      --banner-fg: #ffd76a;
      --muted: #999;
    }
  }
  :root[data-theme="light"] {
    --bg: #f7f7fa; --fg: #1a1a1a; --card-bg: #ffffff; --border: #ddd; --banner-bg: #fff3cd; --banner-fg: #7a5b00; --muted: #666;
  }
  :root[data-theme="dark"] {
    --bg: #14161a; --fg: #e8e8ea; --card-bg: #1e2126; --border: #333; --banner-bg: #3a2f00; --banner-fg: #ffd76a; --muted: #999;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    margin: 0;
    padding: 24px 16px;
    line-height: 1.6;
  }
  .container {
    max-width: 800px;
    margin: 0 auto;
  }
  h1 {
    font-size: 1.5rem;
    margin-bottom: 4px;
  }
  .timestamp {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 20px;
  }
  .banner {
    background: var(--banner-bg);
    color: var(--banner-fg);
    border-radius: 8px;
    padding: 16px 20px;
    font-weight: bold;
    margin-bottom: 20px;
    border: 1px solid var(--border);
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 20px;
    margin-bottom: 20px;
  }
  .disclaimer {
    font-size: 0.85rem;
    color: var(--muted);
    margin-top: 30px;
    border-top: 1px solid var(--border);
    padding-top: 16px;
  }
</style>
</head>
<body>
<div class="container">
  <h1>デイリー・ポートフォリオレポート 2026-09-27</h1>
  <div class="timestamp">生成開始 07:03 JST</div>
  <div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
  <div class="card">
    <p>本日分のレポートを生成しています。価格データの読み込み、テクニカル分析、セクター分析、仮想オートマティック取引セクションなどを順に作成中です。しばらくお待ちください。</p>
  </div>
  <div class="disclaimer">
    これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。
  </div>
</div>
</body>
</html>
