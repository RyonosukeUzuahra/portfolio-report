<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-08-14</title>
<style>
  :root {
    --bg: #f5f6f8;
    --fg: #1a1d23;
    --card-bg: #ffffff;
    --border: #dfe3e8;
    --accent: #2563eb;
    --warn-bg: #fff8e1;
    --warn-border: #f5c518;
    --muted: #5a6270;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --fg: #e8eaed;
      --card-bg: #1e2127;
      --border: #33373f;
      --accent: #6ea8fe;
      --warn-bg: #3a3312;
      --warn-border: #d4a72c;
      --muted: #9aa2b1;
    }
  }
  :root[data-theme="light"] {
    --bg: #f5f6f8;
    --fg: #1a1d23;
    --card-bg: #ffffff;
    --border: #dfe3e8;
    --accent: #2563eb;
    --warn-bg: #fff8e1;
    --warn-border: #f5c518;
    --muted: #5a6270;
  }
  :root[data-theme="dark"] {
    --bg: #14161a;
    --fg: #e8eaed;
    --card-bg: #1e2127;
    --border: #33373f;
    --accent: #6ea8fe;
    --warn-bg: #3a3312;
    --warn-border: #d4a72c;
    --muted: #9aa2b1;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    margin: 0;
    padding: 2rem 1rem;
    line-height: 1.7;
  }
  .container {
    max-width: 760px;
    margin: 0 auto;
  }
  h1 {
    font-size: 1.5rem;
    margin-bottom: 0.3rem;
  }
  .timestamp {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 1.5rem;
  }
  .banner {
    background: var(--warn-bg);
    border: 1px solid var(--warn-border);
    border-radius: 8px;
    padding: 1rem 1.2rem;
    font-weight: 600;
    margin-bottom: 1.5rem;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.2rem;
    margin-bottom: 1.2rem;
  }
  .disclaimer {
    color: var(--muted);
    font-size: 0.85rem;
    border-top: 1px solid var(--border);
    padding-top: 1rem;
    margin-top: 2rem;
  }
</style>
</head>
<body>
<div class="container">
  <h1>デイリー・ポートフォリオレポート 2026-08-14</h1>
  <div class="timestamp">生成開始 07:06 JST</div>
  <div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
  <div class="card">
    <p>価格データの確認とニュース分析を実施中です。完了次第、このページは自動的に更新されます。</p>
  </div>
  <div class="disclaimer">
    これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。
  </div>
</div>
</body>
</html>
