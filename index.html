<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-10-09</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1f2328; --muted:#57606a; --line:#d0d7de; --accent:#0969da; --banner-bg:#fff8c5; --banner-fg:#7d4e00; --banner-line:#d4a72c;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0d1117; --fg:#e6edf3; --muted:#9198a1; --line:#30363d; --accent:#4493f8; --banner-bg:#3b2f00; --banner-fg:#f0d264; --banner-line:#8a6d00;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0d1117; --fg:#e6edf3; --muted:#9198a1; --line:#30363d; --accent:#4493f8; --banner-bg:#3b2f00; --banner-fg:#f0d264; --banner-line:#8a6d00;
  }
  body{ background:var(--bg); color:var(--fg); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif; margin:0; padding:1.5rem; line-height:1.7; }
  h1{ font-size:1.4rem; margin:0 0 .3rem; }
  .timestamp{ color:var(--muted); font-size:.9rem; margin:0 0 1.2rem; }
  .banner{ background:var(--banner-bg); color:var(--banner-fg); border:1px solid var(--banner-line); border-radius:8px; padding:1rem 1.2rem; font-size:1.05rem; margin:0 0 1.2rem; }
  .disclaimer{ color:var(--muted); font-size:.85rem; border-top:1px solid var(--line); margin-top:2rem; padding-top:1rem; }
</style>
</head>
<body>
<h1>デイリー・ポートフォリオレポート 2026-10-09</h1>

<p class="disclaimer">これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。</p>
</body>
</html>
