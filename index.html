<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-11-16</title>
<style>
  :root {
    --bg: #f8fafc;
    --fg: #0f172a;
    --card-bg: #ffffff;
    --border: #e2e8f0;
    --banner-bg: #fff7ed;
    --banner-border: #fb923c;
    --muted: #64748b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b1220;
      --fg: #e2e8f0;
      --card-bg: #121a2b;
      --border: #263146;
      --banner-bg: #2a1f10;
      --banner-border: #f59e0b;
      --muted: #94a3b8;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b1220;
    --fg: #e2e8f0;
    --card-bg: #121a2b;
    --border: #263146;
    --banner-bg: #2a1f10;
    --banner-border: #f59e0b;
    --muted: #94a3b8;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    margin: 0;
    padding: 24px 16px;
    line-height: 1.7;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .ts { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
  .banner {
    background: var(--banner-bg);
    border: 1px solid var(--banner-border);
    border-radius: 10px;
    padding: 16px;
    font-weight: 600;
    margin-bottom: 20px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .disclaimer { color: var(--muted); font-size: 0.85rem; margin-top: 24px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>デイリー・ポートフォリオレポート 2026-11-16</h1>
  <div class="ts">生成開始 2026-11-16 07:39 JST</div>
  <div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
  <div class="card">本日分のレポートを作成しています。価格確認・テクニカル分析・セクター分析・本日の注目セットアップ・仮想オートマティック取引セクションなどを順次生成中です。</div>
  <div class="disclaimer">これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。</div>
</div>
</body>
</html>
