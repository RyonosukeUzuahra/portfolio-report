<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-08-31</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f5;
    --fg: #1a1a1a;
    --card-bg: #ffffff;
    --border: #e0e0e0;
    --accent: #dc2626;
    --banner-bg: #fff8e1;
    --banner-border: #eab308;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c;
      --fg: #e8e8e6;
      --card-bg: #1f2227;
      --border: #33363c;
      --banner-bg: #2b2410;
      --banner-border: #eab308;
    }
  }
  [data-theme="light"] {
    --bg: #f7f7f5; --fg: #1a1a1a; --card-bg: #ffffff; --border: #e0e0e0; --banner-bg: #fff8e1; --banner-border: #eab308;
  }
  [data-theme="dark"] {
    --bg: #16181c; --fg: #e8e8e6; --card-bg: #1f2227; --border: #33363c; --banner-bg: #2b2410; --banner-border: #eab308;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    margin: 0;
    padding: 24px;
    line-height: 1.7;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .timestamp { color: #888; font-size: 0.9rem; margin-bottom: 20px; }
  .banner {
    background: var(--banner-bg);
    border: 1px solid var(--banner-border);
    border-radius: 8px;
    padding: 16px;
    font-size: 1.05rem;
    font-weight: 600;
    margin-bottom: 20px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .disclaimer {
    font-size: 0.85rem;
    color: #888;
    border-top: 1px solid var(--border);
    padding-top: 12px;
    margin-top: 24px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>デイリー・ポートフォリオレポート 2026-08-31</h1>
  <div class="timestamp">生成開始 2026-08-31 07:04 JST</div>
  <div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
  <div class="card">
    価格データの読み込みと分析を実行中です。完了次第、本ページは全セクション(価格確認・50%ルール判定・ニュース・テクニカル分析・セクター配分・本日の戦略候補・仮想オートマティック取引)を含む最終版に自動的に置き換わります。
  </div>
  <div class="disclaimer">
    これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。
  </div>
</div>
</body>
</html>
