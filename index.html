<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-10-22</title>
<style>
  :root { --bg:#f7f7f8; --fg:#1a1a1a; --card:#ffffff; --border:#e2e2e2; --accent:#2563eb; --banner-bg:#fff7e6; --banner-border:#f0b429; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111317; --fg:#eaeaea; --card:#1b1e24; --border:#2c2f36; --accent:#60a5fa; --banner-bg:#2a2410; --banner-border:#b58a1a; }
  }
  body { background:var(--bg); color:var(--fg); font-family:-apple-system,"Hiragino Sans","Yu Gothic",sans-serif; margin:0; padding:24px; line-height:1.7; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px 24px; max-width:720px; margin:0 auto 16px; }
  h1 { font-size:1.4rem; margin:0 0 8px; }
  .timestamp { color:#888; font-size:0.9rem; margin-bottom:16px; }
  .banner { background:var(--banner-bg); border:1px solid var(--banner-border); border-radius:8px; padding:14px 18px; font-weight:bold; margin-bottom:16px; }
  .disclaimer { font-size:0.85rem; color:#888; margin-top:24px; }
</style>
</head>
<body>
  <div class="card">
    <h1>デイリー・ポートフォリオレポート 2026-10-22</h1>
    <div class="timestamp">生成開始 2026-10-22 07:03 JST</div>
    <div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
    <div class="disclaimer">これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。</div>
  </div>
</body>
</html>
