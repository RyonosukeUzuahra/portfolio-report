<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-11-14</title>
<style>
  :root {
    --bg: #f7f8fa; --fg: #1a1a1a; --card-bg: #ffffff; --border: #e0e0e0; --accent: #2563eb;
    --warn-bg: #fff7e6; --warn-border: #f0b429; --muted: #666666;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1115; --fg: #e6e6e6; --card-bg: #1a1d23; --border: #2a2d33; --accent: #60a5fa;
      --warn-bg: #2a2410; --warn-border: #a67c00; --muted: #9aa0a6; }
  }
  :root[data-theme="light"] { --bg: #f7f8fa; --fg: #1a1a1a; --card-bg: #ffffff; --border: #e0e0e0; --accent: #2563eb;
    --warn-bg: #fff7e6; --warn-border: #f0b429; --muted: #666666; }
  :root[data-theme="dark"] { --bg: #0f1115; --fg: #e6e6e6; --card-bg: #1a1d23; --border: #2a2d33; --accent: #60a5fa;
    --warn-bg: #2a2410; --warn-border: #a67c00; --muted: #9aa0a6; }
  body { background: var(--bg); color: var(--fg); font-family: -apple-system, "Hiragino Sans", "Helvetica Neue", Arial, sans-serif; margin: 0; padding: 24px 16px; line-height: 1.6; }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .ts { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
  .banner { background: var(--warn-bg); border: 1px solid var(--warn-border); border-radius: 8px; padding: 16px; font-size: 1.05rem; margin-bottom: 20px; }
  .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
  .disclaimer { color: var(--muted); font-size: 0.85rem; margin-top: 24px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>デイリー・ポートフォリオレポート 2026-11-14</h1>
  <div class="ts">生成開始 2026-11-14 07:39 JST</div>
  <div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
  <div class="card">
    <p>最新のデータを取得・分析し、レポートを作成しています。しばらくお待ちください。</p>
  </div>
  <p class="disclaimer">これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。</p>
</div>
</body>
</html>
