<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-08-27</title>
<style>
  :root {
    --bg: #f8fafc;
    --fg: #0f172a;
    --card-bg: #ffffff;
    --border: #e2e8f0;
    --banner-bg: #fef9c3;
    --banner-fg: #854d0e;
    --muted: #64748b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --fg: #e2e8f0;
      --card-bg: #1e293b;
      --border: #334155;
      --banner-bg: #422006;
      --banner-fg: #fde68a;
      --muted: #94a3b8;
    }
  }
  html[data-theme="light"] {
    --bg: #f8fafc; --fg: #0f172a; --card-bg: #ffffff; --border: #e2e8f0;
    --banner-bg: #fef9c3; --banner-fg: #854d0e; --muted: #64748b;
  }
  html[data-theme="dark"] {
    --bg: #0f172a; --fg: #e2e8f0; --card-bg: #1e293b; --border: #334155;
    --banner-bg: #422006; --banner-fg: #fde68a; --muted: #94a3b8;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    max-width: 900px;
    margin: 0 auto;
    padding: 24px 16px 64px;
    line-height: 1.7;
  }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .timestamp { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
  .banner {
    background: var(--banner-bg);
    color: var(--banner-fg);
    border-radius: 8px;
    padding: 16px 20px;
    font-weight: 600;
    margin-bottom: 24px;
    border: 1px solid var(--border);
  }
  .disclaimer {
    margin-top: 40px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.85rem;
  }
</style>
</head>
<body>
  <h1>デイリー・ポートフォリオレポート 2026-08-27</h1>
  <div class="timestamp">生成開始 2026-08-27 07:03 JST</div>
  <div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
  <div class="disclaimer">これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。</div>
</body>
</html>
