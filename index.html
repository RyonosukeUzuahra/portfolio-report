<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-08-20</title>
<style>
  :root {
    --bg: #f7f7f8;
    --card-bg: #ffffff;
    --text: #1a1a1a;
    --muted: #666666;
    --border: #e0e0e0;
    --accent: #b45309;
    --banner-bg: #fff7ed;
    --banner-border: #f59e0b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14151a;
      --card-bg: #1e1f26;
      --text: #e8e8ea;
      --muted: #9a9aa2;
      --border: #33343c;
      --accent: #fbbf24;
      --banner-bg: #2a2210;
      --banner-border: #92651a;
    }
  }
  [data-theme="light"] {
    --bg: #f7f7f8;
    --card-bg: #ffffff;
    --text: #1a1a1a;
    --muted: #666666;
    --border: #e0e0e0;
    --accent: #b45309;
    --banner-bg: #fff7ed;
    --banner-border: #f59e0b;
  }
  [data-theme="dark"] {
    --bg: #14151a;
    --card-bg: #1e1f26;
    --text: #e8e8ea;
    --muted: #9a9aa2;
    --border: #33343c;
    --accent: #fbbf24;
    --banner-bg: #2a2210;
    --banner-border: #92651a;
  }
  body {
    margin: 0;
    padding: 2rem 1rem;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    line-height: 1.7;
  }
  .container {
    max-width: 720px;
    margin: 0 auto;
  }
  h1 {
    font-size: 1.5rem;
    margin-bottom: 0.25rem;
  }
  .timestamp {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 1.5rem;
  }
  .banner {
    background: var(--banner-bg);
    border: 1px solid var(--banner-border);
    border-radius: 8px;
    padding: 1rem 1.25rem;
    margin-bottom: 1.5rem;
    font-weight: 600;
  }
  .disclaimer {
    margin-top: 2rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.85rem;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>デイリー・ポートフォリオレポート 2026-08-20</h1>
    <div class="timestamp">生成開始 2026-08-20 07:03 JST</div>
    <div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
    <div class="disclaimer">これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。</div>
  </div>
</body>
</html>
