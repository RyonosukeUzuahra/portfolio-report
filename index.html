<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-11-13</title>
<style>
  :root {
    --bg: #f7f8fa;
    --fg: #1a1a1a;
    --card-bg: #ffffff;
    --border: #e0e0e0;
    --accent: #2563eb;
    --warn-bg: #fff7e6;
    --warn-border: #f0b429;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212;
      --fg: #e8e8e8;
      --card-bg: #1e1e1e;
      --border: #333333;
      --accent: #60a5fa;
      --warn-bg: #3a2f10;
      --warn-border: #f0b429;
    }
  }
  html[data-theme="light"] {
    --bg: #f7f8fa; --fg: #1a1a1a; --card-bg: #ffffff; --border: #e0e0e0; --accent: #2563eb;
    --warn-bg: #fff7e6; --warn-border: #f0b429;
  }
  html[data-theme="dark"] {
    --bg: #121212; --fg: #e8e8e8; --card-bg: #1e1e1e; --border: #333333; --accent: #60a5fa;
    --warn-bg: #3a2f10; --warn-border: #f0b429;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    margin: 0;
    padding: 24px 16px;
    line-height: 1.6;
  }
  .container { max-width: 800px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .timestamp { color: #888; font-size: 0.9rem; margin-bottom: 20px; }
  .status-banner {
    background: var(--warn-bg);
    border: 1px solid var(--warn-border);
    border-radius: 8px;
    padding: 16px;
    font-size: 1.05rem;
    margin-bottom: 20px;
  }
  .disclaimer {
    margin-top: 32px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: 0.85rem;
    color: #888;
  }
</style>
</head>
<body>
<div class="container">
  <h1>デイリー・ポートフォリオレポート 2026-11-13</h1>
  <div class="timestamp">生成開始 07:39 JST</div>
  <div class="status-banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
  <div class="disclaimer">これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。</div>
</div>
</body>
</html>
