<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-09-26</title>
<style>
  :root {
    --bg: #f8fafc;
    --fg: #0f172a;
    --card-bg: #ffffff;
    --border: #e2e8f0;
    --accent: #2563eb;
    --warn-bg: #fef3c7;
    --warn-border: #f59e0b;
    --warn-fg: #78350f;
    --muted: #64748b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --fg: #e2e8f0;
      --card-bg: #1e293b;
      --border: #334155;
      --accent: #60a5fa;
      --warn-bg: #422006;
      --warn-border: #b45309;
      --warn-fg: #fde68a;
      --muted: #94a3b8;
    }
  }
  html[data-theme="dark"] {
    --bg: #0f172a;
    --fg: #e2e8f0;
    --card-bg: #1e293b;
    --border: #334155;
    --accent: #60a5fa;
    --warn-bg: #422006;
    --warn-border: #b45309;
    --warn-fg: #fde68a;
    --muted: #94a3b8;
  }
  html[data-theme="light"] {
    --bg: #f8fafc;
    --fg: #0f172a;
    --card-bg: #ffffff;
    --border: #e2e8f0;
    --accent: #2563eb;
    --warn-bg: #fef3c7;
    --warn-border: #f59e0b;
    --warn-fg: #78350f;
    --muted: #64748b;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
    margin: 0;
    padding: 24px 16px 60px;
    line-height: 1.7;
  }
  .container { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .timestamp { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
  .banner {
    background: var(--warn-bg);
    border: 1px solid var(--warn-border);
    color: var(--warn-fg);
    border-radius: 8px;
    padding: 16px 18px;
    font-weight: 600;
    margin-bottom: 20px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 16px;
  }
  .disclaimer {
    color: var(--muted);
    font-size: 0.85rem;
    border-top: 1px solid var(--border);
    padding-top: 16px;
    margin-top: 24px;
  }
</style>
</head>
<body>
<div class="container">
  <h1>デイリー・ポートフォリオレポート 2026-09-26</h1>
  <div class="timestamp">生成開始 2026-09-26 07:03 JST</div>
  <div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
  <div class="card">
    <p>本日分のポートフォリオ分析を生成しています。価格データ、テクニカル指標、セクター配分、個別銘柄の売買提案などを順次まとめています。完了までしばらくお待ちください。</p>
  </div>
  <div class="disclaimer">これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。</div>
</div>
</body>
</html>
