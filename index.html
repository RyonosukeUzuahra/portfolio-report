<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-08-08</title>
<style>
  :root {
    --bg: #f5f6f8;
    --fg: #1a1d23;
    --card-bg: #ffffff;
    --border: #e0e2e7;
    --accent: #2563eb;
    --warn-bg: #fff8e1;
    --warn-border: #f0c419;
    --muted: #6b7280;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --fg: #e8e9ec;
      --card-bg: #1e2127;
      --border: #2c3038;
      --accent: #5b8def;
      --warn-bg: #3a2f10;
      --warn-border: #caa53a;
      --muted: #9aa1ac;
    }
  }
  html[data-theme="light"] {
    --bg: #f5f6f8; --fg: #1a1d23; --card-bg: #ffffff; --border: #e0e2e7;
    --accent: #2563eb; --warn-bg: #fff8e1; --warn-border: #f0c419; --muted: #6b7280;
  }
  html[data-theme="dark"] {
    --bg: #14161a; --fg: #e8e9ec; --card-bg: #1e2127; --border: #2c3038;
    --accent: #5b8def; --warn-bg: #3a2f10; --warn-border: #caa53a; --muted: #9aa1ac;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2rem 1rem; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    line-height: 1.7;
  }
  .container { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
  .timestamp { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
  .banner {
    background: var(--warn-bg); border: 1px solid var(--warn-border);
    border-radius: 8px; padding: 1rem 1.25rem; font-weight: 600; margin-bottom: 1.5rem;
  }
  .card {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px;
    padding: 1.25rem; margin-bottom: 1rem;
  }
  .disclaimer { color: var(--muted); font-size: 0.85rem; margin-top: 2rem; border-top: 1px solid var(--border); padding-top: 1rem; }
</style>
</head>
<body>
<div class="container">
  <h1>デイリー・ポートフォリオレポート 2026-08-08</h1>
  <div class="timestamp">生成開始 2026-08-08 07:03 JST</div>
  <div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
  <div class="card">
    レポートを生成しています。保有銘柄・ウォッチリストの価格確認、ニュース収集、分析セクションの作成が完了次第、このページは自動的に最新の内容に置き換わります。
  </div>
  <div class="disclaimer">
    これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。
  </div>
</div>
</body>
</html>
