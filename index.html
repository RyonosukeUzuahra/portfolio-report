<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-10-18</title>
<style>
  :root {
    --bg: #f8fafc;
    --fg: #1e293b;
    --card-bg: #ffffff;
    --border: #e2e8f0;
    --banner-bg: #fef3c7;
    --banner-border: #f59e0b;
    --muted: #64748b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --fg: #e2e8f0;
      --card-bg: #1e293b;
      --border: #334155;
      --banner-bg: #3f2d05;
      --banner-border: #d97706;
      --muted: #94a3b8;
    }
  }
  :root[data-theme="light"] {
    --bg: #f8fafc; --fg: #1e293b; --card-bg: #ffffff; --border: #e2e8f0;
    --banner-bg: #fef3c7; --banner-border: #f59e0b; --muted: #64748b;
  }
  :root[data-theme="dark"] {
    --bg: #0f172a; --fg: #e2e8f0; --card-bg: #1e293b; --border: #334155;
    --banner-bg: #3f2d05; --banner-border: #d97706; --muted: #94a3b8;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    margin: 0;
    padding: 24px 16px;
    line-height: 1.6;
  }
  .container { max-width: 800px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .timestamp { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
  .banner {
    background: var(--banner-bg);
    border: 1px solid var(--banner-border);
    border-radius: 8px;
    padding: 16px;
    margin: 20px 0;
    font-size: 1.1rem;
    font-weight: 600;
  }
  .disclaimer {
    margin-top: 32px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.85rem;
  }
</style>
</head>
<body>
<div class="container">
  <h1>デイリー・ポートフォリオレポート 2026-10-18</h1>
  <div class="timestamp">生成開始 07:02 JST</div>
  <div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
  <div class="disclaimer">
    これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。
  </div>
</div>
</body>
</html>
