<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-09-23</title>
<style>
  :root {
    --bg: #f7f7fb;
    --fg: #1a1a1a;
    --card-bg: #ffffff;
    --border: #e0e0e5;
    --banner-bg: #fff3cd;
    --banner-fg: #7a5c00;
    --muted: #666;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14151a;
      --fg: #e8e8ec;
      --card-bg: #1e1f26;
      --border: #33343d;
      --banner-bg: #4a3b00;
      --banner-fg: #ffdf7e;
      --muted: #a0a0aa;
    }
  }
  [data-theme="light"] {
    --bg: #f7f7fb; --fg: #1a1a1a; --card-bg: #ffffff; --border: #e0e0e5;
    --banner-bg: #fff3cd; --banner-fg: #7a5c00; --muted: #666;
  }
  [data-theme="dark"] {
    --bg: #14151a; --fg: #e8e8ec; --card-bg: #1e1f26; --border: #33343d;
    --banner-bg: #4a3b00; --banner-fg: #ffdf7e; --muted: #a0a0aa;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    margin: 0;
    padding: 24px 16px;
    line-height: 1.7;
  }
  .container { max-width: 780px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .timestamp { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
  .banner {
    background: var(--banner-bg);
    color: var(--banner-fg);
    border-radius: 8px;
    padding: 16px 20px;
    font-weight: 600;
    margin-bottom: 20px;
  }
  .disclaimer {
    margin-top: 32px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.85rem;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>デイリー・ポートフォリオレポート 2026-09-23</h1>
    <div class="timestamp">生成開始 2026-09-23 07:03 JST</div>
    <div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
    <div class="disclaimer">
      これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。
    </div>
  </div>
</body>
</html>
