<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>デイリー・ポートフォリオレポート 2026-09-14</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f9;
    --fg: #1a1a1a;
    --card-bg: #ffffff;
    --border: #e0e0e5;
    --accent: #b45309;
    --banner-bg: #fff7ed;
    --banner-border: #fdba74;
    --muted: #6b7280;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14151a;
      --fg: #e8e8ea;
      --card-bg: #1e1f26;
      --border: #33343d;
      --accent: #fbbf24;
      --banner-bg: #2a2110;
      --banner-border: #92610a;
      --muted: #9ca3af;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14151a;
    --fg: #e8e8ea;
    --card-bg: #1e1f26;
    --border: #33343d;
    --accent: #fbbf24;
    --banner-bg: #2a2110;
    --banner-border: #92610a;
    --muted: #9ca3af;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    margin: 0;
    padding: 24px 16px 60px;
    line-height: 1.7;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .timestamp { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
  .banner {
    background: var(--banner-bg);
    border: 1px solid var(--banner-border);
    color: var(--accent);
    border-radius: 10px;
    padding: 16px 18px;
    font-weight: 600;
    font-size: 1.05rem;
    margin-bottom: 20px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 16px;
  }
  .disclaimer {
    color: var(--muted);
    font-size: 0.85rem;
    border-top: 1px solid var(--border);
    padding-top: 16px;
    margin-top: 24px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>デイリー・ポートフォリオレポート 2026-09-14</h1>
  <div class="timestamp">生成開始 2026-09-14 07:04 JST</div>
  <div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
  <div class="card">
    保有銘柄・ウォッチリストの価格確認、テクニカル分析、セクター分析、本日の戦略、仮想オートマティック取引セクションを順に生成しています。しばらくお待ちください。
  </div>
  <div class="disclaimer">
    これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。
  </div>
</div>
</body>
</html>
