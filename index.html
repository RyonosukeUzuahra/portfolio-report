<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-10-08</title>
<style>
  :root {
    --bg: #f8f9fb;
    --fg: #1a1a1a;
    --card-bg: #ffffff;
    --border: #e2e5ea;
    --accent: #2563eb;
    --warn-bg: #fff7e6;
    --warn-border: #f0b429;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --fg: #e6e6e6;
      --card-bg: #1a1d24;
      --border: #2a2e37;
      --accent: #60a5fa;
      --warn-bg: #3a2e12;
      --warn-border: #f0b429;
    }
  }
  html[data-theme="light"] {
    --bg: #f8f9fb; --fg: #1a1a1a; --card-bg: #ffffff; --border: #e2e5ea; --accent: #2563eb;
    --warn-bg: #fff7e6; --warn-border: #f0b429;
  }
  html[data-theme="dark"] {
    --bg: #0f1115; --fg: #e6e6e6; --card-bg: #1a1d24; --border: #2a2e37; --accent: #60a5fa;
    --warn-bg: #3a2e12; --warn-border: #f0b429;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    margin: 0;
    padding: 24px 16px 64px;
    line-height: 1.7;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .timestamp { color: #888; font-size: 0.9rem; margin-bottom: 20px; }
  .banner {
    background: var(--warn-bg);
    border: 1px solid var(--warn-border);
    border-radius: 8px;
    padding: 16px 20px;
    font-size: 1.1rem;
    font-weight: 600;
    margin-bottom: 24px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 20px;
    margin-bottom: 16px;
  }
  .disclaimer {
    margin-top: 32px;
    font-size: 0.85rem;
    color: #999;
    border-top: 1px solid var(--border);
    padding-top: 16px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>デイリー・ポートフォリオレポート 2026-10-08</h1>
  <div class="timestamp">生成開始 2026-10-08 07:03 JST</div>
  <div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
  <div class="card">
    レポートの本文を生成しています。しばらくお待ちください。
  </div>
  <div class="disclaimer">
    これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。
  </div>
</div>
</body>
</html>
