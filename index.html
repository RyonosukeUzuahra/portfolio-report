<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-08-26</title>
<style>
  :root {
    --bg: #f8fafc;
    --card-bg: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --border: #e2e8f0;
    --accent: #2563eb;
    --warn-bg: #fffbeb;
    --warn-border: #f59e0b;
    --warn-text: #92400e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b1220;
      --card-bg: #131c2e;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --border: #263449;
      --accent: #60a5fa;
      --warn-bg: #2a2110;
      --warn-border: #b45309;
      --warn-text: #fbbf24;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b1220;
    --card-bg: #131c2e;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --border: #263449;
    --accent: #60a5fa;
    --warn-bg: #2a2110;
    --warn-border: #b45309;
    --warn-text: #fbbf24;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Segoe UI", sans-serif;
    max-width: 800px;
    margin: 0 auto;
    padding: 24px 16px 64px;
    line-height: 1.7;
  }
  h1 {
    font-size: 1.5rem;
    margin-bottom: 4px;
  }
  .timestamp {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 20px;
  }
  .banner {
    background: var(--warn-bg);
    border: 1px solid var(--warn-border);
    color: var(--warn-text);
    border-radius: 8px;
    padding: 16px 20px;
    font-weight: 600;
    margin-bottom: 24px;
  }
  .disclaimer {
    margin-top: 32px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.85rem;
  }
</style>
</head>
<body>
  <h1>デイリー・ポートフォリオレポート 2026-08-26</h1>
  <div class="timestamp">生成開始 2026-08-26 07:03 JST</div>
  <div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
  <div class="disclaimer">これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。</div>
</body>
</html>
