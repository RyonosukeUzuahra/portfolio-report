<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-08-16</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card-bg: #ffffff;
    --text: #1a1c1e;
    --muted: #5f6368;
    --border: #e0e2e6;
    --accent: #1a73e8;
    --warn-bg: #fff8e1;
    --warn-border: #f9a825;
    --warn-text: #7a5c00;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161a;
      --card-bg: #1e2126;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --border: #33363b;
      --accent: #8ab4f8;
      --warn-bg: #3a2f00;
      --warn-border: #f9a825;
      --warn-text: #ffd666;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161a;
    --card-bg: #1e2126;
    --text: #e8eaed;
    --muted: #9aa0a6;
    --border: #33363b;
    --accent: #8ab4f8;
    --warn-bg: #3a2f00;
    --warn-border: #f9a825;
    --warn-text: #ffd666;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 64px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    line-height: 1.7;
  }
  .container { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .timestamp { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
  .banner {
    background: var(--warn-bg);
    border: 1px solid var(--warn-border);
    color: var(--warn-text);
    border-radius: 8px;
    padding: 16px 20px;
    font-weight: 600;
    margin-bottom: 24px;
  }
  .disclaimer {
    margin-top: 40px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.85rem;
  }
</style>
</head>
<body>
<div class="container">
  <h1>デイリー・ポートフォリオレポート 2026-08-16</h1>
  <div class="timestamp">生成開始 07:03 JST</div>
  <div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
  <div class="disclaimer">これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。</div>
</div>
</body>
</html>
