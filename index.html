<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-08-12</title>
<style>
  :root {
    --bg: #f7f7fa;
    --fg: #1a1a1a;
    --card-bg: #ffffff;
    --border: #e0e0e5;
    --accent: #b8860b;
    --banner-bg: #fff8e1;
    --banner-border: #f0c419;
    --muted: #666;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --fg: #e8e8ea;
      --card-bg: #1e2126;
      --border: #33363c;
      --accent: #e0b040;
      --banner-bg: #332a10;
      --banner-border: #7a5f18;
      --muted: #a0a0a8;
    }
  }
  [data-theme="light"] {
    --bg: #f7f7fa; --fg: #1a1a1a; --card-bg: #ffffff; --border: #e0e0e5;
    --accent: #b8860b; --banner-bg: #fff8e1; --banner-border: #f0c419; --muted: #666;
  }
  [data-theme="dark"] {
    --bg: #14161a; --fg: #e8e8ea; --card-bg: #1e2126; --border: #33363c;
    --accent: #e0b040; --banner-bg: #332a10; --banner-border: #7a5f18; --muted: #a0a0a8;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 16px 60px;
    line-height: 1.7;
  }
  h1 {
    font-size: 1.4rem;
    border-bottom: 2px solid var(--border);
    padding-bottom: 12px;
  }
  .timestamp { color: var(--muted); font-size: 0.9rem; margin-top: 4px; }
  .banner {
    background: var(--banner-bg);
    border: 1px solid var(--banner-border);
    border-radius: 8px;
    padding: 16px;
    margin: 20px 0;
    font-weight: 600;
  }
  .disclaimer {
    margin-top: 40px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: 0.85rem;
    color: var(--muted);
  }
</style>
</head>
<body>
  <h1>デイリー・ポートフォリオレポート 2026-08-12</h1>
  <div class="timestamp">生成開始 2026-08-12 07:03 JST</div>
  <div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
  <div class="disclaimer">
    これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。
  </div>
</body>
</html>
