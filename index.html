<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-08-24</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f8fa;
    --fg: #1a1d23;
    --card-bg: #ffffff;
    --border: #e2e5ea;
    --muted: #6b7280;
    --accent: #2563eb;
    --banner-bg: #fef3c7;
    --banner-fg: #92400e;
    --banner-border: #f59e0b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161a;
      --fg: #e5e7eb;
      --card-bg: #1e2128;
      --border: #2f333c;
      --muted: #9ca3af;
      --accent: #60a5fa;
      --banner-bg: #3f2d0a;
      --banner-fg: #fcd34d;
      --banner-border: #b45309;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161a;
    --fg: #e5e7eb;
    --card-bg: #1e2128;
    --border: #2f333c;
    --muted: #9ca3af;
    --accent: #60a5fa;
    --banner-bg: #3f2d0a;
    --banner-fg: #fcd34d;
    --banner-border: #b45309;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    line-height: 1.7;
    max-width: 860px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }
  h1 {
    font-size: 1.5rem;
    margin-bottom: 4px;
  }
  .timestamp {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 20px;
  }
  .banner {
    background: var(--banner-bg);
    color: var(--banner-fg);
    border: 1px solid var(--banner-border);
    border-radius: 8px;
    padding: 16px 20px;
    font-weight: 600;
    margin: 20px 0;
  }
  .disclaimer {
    margin-top: 40px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.85rem;
  }
</style>
</head>
<body>
<h1>デイリー・ポートフォリオレポート 2026-08-24</h1>
<div class="timestamp">生成開始 2026-08-24 07:03 JST</div>
<div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
<div class="disclaimer">これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。</div>
</body>
</html>
