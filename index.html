<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-09-24</title>
<style>
  :root {
    --bg: #f7f7f9; --fg: #1a1a1a; --card-bg: #ffffff; --border: #e0e0e0;
    --accent: #2563eb; --warn-bg: #fff7ed; --warn-border: #ea580c; --warn-fg: #7c2d12;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121212; --fg: #eaeaea; --card-bg: #1e1e1e; --border: #333;
      --accent: #60a5fa; --warn-bg: #2a1e12; --warn-border: #ea580c; --warn-fg: #fdba74; }
  }
  :root[data-theme="light"] { --bg: #f7f7f9; --fg: #1a1a1a; --card-bg: #ffffff; --border: #e0e0e0; --accent: #2563eb; --warn-bg: #fff7ed; --warn-border: #ea580c; --warn-fg: #7c2d12; }
  :root[data-theme="dark"] { --bg: #121212; --fg: #eaeaea; --card-bg: #1e1e1e; --border: #333; --accent: #60a5fa; --warn-bg: #2a1e12; --warn-border: #ea580c; --warn-fg: #fdba74; }
  body { background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; margin: 0; padding: 24px 16px; line-height: 1.7; }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .timestamp { color: #888; font-size: 0.9rem; margin-bottom: 20px; }
  .banner { background: var(--warn-bg); border: 1px solid var(--warn-border); color: var(--warn-fg); padding: 16px; border-radius: 8px; font-weight: bold; margin-bottom: 20px; }
  .disclaimer { margin-top: 32px; font-size: 0.85rem; color: #888; border-top: 1px solid var(--border); padding-top: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>デイリー・ポートフォリオレポート 2026-09-24</h1>
  <div class="timestamp">生成開始 2026-09-24 07:03 JST</div>
  <div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
  <div class="disclaimer">これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。</div>
</div>
</body>
</html>
