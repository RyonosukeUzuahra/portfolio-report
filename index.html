body{ background:var(--bg); color:var(--fg); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Hiragino Sans,"Noto Sans JP",sans-serif; max-width:860px; margin:0 auto; padding:1.5rem 1rem 3rem; line-height:1.7; }
