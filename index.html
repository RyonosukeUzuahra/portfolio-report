<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-09-21</title>
<style>
  :root {
    --bg: #f7f7f9;
    --fg: #1a1a1a;
    --card-bg: #ffffff;
    --border: #e2e2e6;
    --accent: #2563eb;
    --banner-bg: #fff7e6;
    --banner-border: #f0ad4e;
    --muted: #666;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --fg: #e6e6e6;
      --card-bg: #1a1c22;
      --border: #2a2d34;
      --accent: #60a5fa;
      --banner-bg: #2a2410;
      --banner-border: #b8860b;
      --muted: #9a9a9a;
    }
  }
  :root[data-theme="light"] {
    --bg: #f7f7f9; --fg: #1a1a1a; --card-bg: #ffffff; --border: #e2e2e6; --accent: #2563eb; --banner-bg: #fff7e6; --banner-border: #f0ad4e; --muted: #666;
  }
  :root[data-theme="dark"] {
    --bg: #0f1115; --fg: #e6e6e6; --card-bg: #1a1c22; --border: #2a2d34; --accent: #60a5fa; --banner-bg: #2a2410; --banner-border: #b8860b; --muted: #9a9a9a;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    margin: 0;
    padding: 24px 16px;
    line-height: 1.6;
  }
  .container { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .timestamp { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
  .banner {
    background: var(--banner-bg);
    border: 1px solid var(--banner-border);
    border-radius: 8px;
    padding: 16px;
    margin: 16px 0;
    font-weight: 600;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin: 16px 0;
  }
  .disclaimer {
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 32px;
    border-top: 1px solid var(--border);
    padding-top: 16px;
  }
</style>
</head>
<body>
<div class="container">
  <h1>デイリー・ポートフォリオレポート 2026-09-21</h1>
  <div class="timestamp">生成開始 2026-09-21 07:02 JST</div>
  <div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
  <div class="card">
    <p>本日分のレポートを作成しています。価格データの確認、テクニカル分析、セクター分析、ウォッチリスト評価などを順次処理中です。完了次第このページは自動的に更新されます。</p>
  </div>
  <div class="disclaimer">
    これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。
  </div>
</div>
</body>
</html>
