<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-10-23</title>
<style>
  :root {
    --bg: #f7f8fa;
    --fg: #1a1a1a;
    --card-bg: #ffffff;
    --border: #e0e0e0;
    --accent: #2563eb;
    --banner-bg: #fff7e6;
    --banner-border: #f0b429;
    --muted: #666;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121417;
      --fg: #e8e8e8;
      --card-bg: #1c1f24;
      --border: #333;
      --accent: #60a5fa;
      --banner-bg: #3a2f10;
      --banner-border: #f0b429;
      --muted: #aaa;
    }
  }
  :root[data-theme="light"] {
    --bg: #f7f8fa; --fg: #1a1a1a; --card-bg: #ffffff; --border: #e0e0e0;
    --accent: #2563eb; --banner-bg: #fff7e6; --banner-border: #f0b429; --muted: #666;
  }
  :root[data-theme="dark"] {
    --bg: #121417; --fg: #e8e8e8; --card-bg: #1c1f24; --border: #333;
    --accent: #60a5fa; --banner-bg: #3a2f10; --banner-border: #f0b429; --muted: #aaa;
  }
  body {
    margin: 0; padding: 24px; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .timestamp { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
  .banner {
    background: var(--banner-bg); border: 1px solid var(--banner-border);
    border-radius: 8px; padding: 16px; font-size: 1.05rem; font-weight: 600;
    margin-bottom: 20px;
  }
  .disclaimer {
    margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--border);
    font-size: 0.85rem; color: var(--muted);
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>デイリー・ポートフォリオレポート 2026-10-23</h1>
  <div class="timestamp">生成開始 2026-10-23 07:03 JST</div>
  <div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
  <div class="disclaimer">これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。</div>
</div>
</body>
</html>
