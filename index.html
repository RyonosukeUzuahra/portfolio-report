<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-09-18</title>
<style>
  :root {
    --bg: #f7f8fa;
    --fg: #1a1d23;
    --card-bg: #ffffff;
    --border: #e2e5ea;
    --accent: #2563eb;
    --banner-bg: #fff7e6;
    --banner-border: #f0b429;
    --muted: #6b7280;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161a;
      --fg: #e6e8eb;
      --card-bg: #1e2126;
      --border: #30343b;
      --accent: #60a5fa;
      --banner-bg: #3a2f14;
      --banner-border: #b8860b;
      --muted: #9aa1ac;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161a;
    --fg: #e6e8eb;
    --card-bg: #1e2126;
    --border: #30343b;
    --accent: #60a5fa;
    --banner-bg: #3a2f14;
    --banner-border: #b8860b;
    --muted: #9aa1ac;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Segoe UI", sans-serif;
    margin: 0;
    padding: 24px 16px;
    line-height: 1.7;
  }
  .wrap { max-width: 800px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .timestamp { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
  .banner {
    background: var(--banner-bg);
    border: 1px solid var(--banner-border);
    border-radius: 8px;
    padding: 16px;
    font-size: 1.05rem;
    margin-bottom: 20px;
  }
  .disclaimer {
    margin-top: 32px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.85rem;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>デイリー・ポートフォリオレポート 2026-09-18</h1>
  <div class="timestamp">生成開始 2026-09-18 07:03 JST</div>
  <div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
  <div class="disclaimer">これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。</div>
</div>
</body>
</html>
