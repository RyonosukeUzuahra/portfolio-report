<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-10-01</title>
<style>
  :root {
    --bg: #f7f7f9;
    --fg: #1a1a1a;
    --card-bg: #ffffff;
    --border: #e0e0e0;
    --accent: #2563eb;
    --warn-bg: #fff7e6;
    --warn-border: #f0b429;
    --muted: #666;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212;
      --fg: #e8e8e8;
      --card-bg: #1e1e1e;
      --border: #333;
      --accent: #60a5fa;
      --warn-bg: #3a2f10;
      --warn-border: #f0b429;
      --muted: #aaa;
    }
  }
  html[data-theme="dark"] {
    --bg: #121212;
    --fg: #e8e8e8;
    --card-bg: #1e1e1e;
    --border: #333;
    --accent: #60a5fa;
    --warn-bg: #3a2f10;
    --warn-border: #f0b429;
    --muted: #aaa;
  }
  html[data-theme="light"] {
    --bg: #f7f7f9;
    --fg: #1a1a1a;
    --card-bg: #ffffff;
    --border: #e0e0e0;
    --accent: #2563eb;
    --warn-bg: #fff7e6;
    --warn-border: #f0b429;
    --muted: #666;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    margin: 0;
    padding: 2rem 1rem;
    line-height: 1.7;
  }
  .wrap { max-width: 800px; margin: 0 auto; }
  h1 { font-size: 1.6rem; margin-bottom: 0.3rem; }
  .timestamp { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
  .banner {
    background: var(--warn-bg);
    border: 1px solid var(--warn-border);
    border-radius: 8px;
    padding: 1rem 1.2rem;
    margin-bottom: 1.5rem;
    font-size: 1.05rem;
  }
  .disclaimer {
    margin-top: 2rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
    font-size: 0.85rem;
    color: var(--muted);
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>デイリー・ポートフォリオレポート 2026-10-01</h1>
  <div class="timestamp">生成開始 07:03 JST</div>
  <div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
  <div class="disclaimer">これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。</div>
</div>
</body>
</html>
