<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-11-02</title>
<style>
  :root {
    --bg: #f8f9fb;
    --fg: #1a1a1a;
    --card-bg: #ffffff;
    --border: #e2e5ea;
    --accent: #2563eb;
    --banner-bg: #fff7e6;
    --banner-border: #f0ad4e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121417;
      --fg: #e8e9ec;
      --card-bg: #1c1f24;
      --border: #333842;
      --accent: #60a5fa;
      --banner-bg: #332b12;
      --banner-border: #d4a017;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121417;
    --fg: #e8e9ec;
    --card-bg: #1c1f24;
    --border: #333842;
    --accent: #60a5fa;
    --banner-bg: #332b12;
    --banner-border: #d4a017;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    margin: 0;
    padding: 24px 16px;
    line-height: 1.7;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .timestamp { color: #888; font-size: 0.9rem; margin-bottom: 20px; }
  .banner {
    background: var(--banner-bg);
    border: 1px solid var(--banner-border);
    border-radius: 8px;
    padding: 16px;
    font-size: 1.05rem;
    margin-bottom: 20px;
  }
  .disclaimer {
    margin-top: 24px;
    font-size: 0.85rem;
    color: #888;
    border-top: 1px solid var(--border);
    padding-top: 12px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>デイリー・ポートフォリオレポート 2026-11-02</h1>
  <div class="timestamp">生成開始 07:03 JST</div>
  <div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
  <div class="disclaimer">これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。</div>
</div>
</body>
</html>
