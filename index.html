<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-11-23</title>
<style>
  :root {
    --bg: #f8fafc;
    --fg: #0f172a;
    --card: #ffffff;
    --border: #e2e8f0;
    --accent: #2563eb;
    --warn-bg: #fef3c7;
    --warn-fg: #92400e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f172a;
      --fg: #e2e8f0;
      --card: #1e293b;
      --border: #334155;
      --accent: #60a5fa;
      --warn-bg: #451a03;
      --warn-fg: #fde68a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f172a;
    --fg: #e2e8f0;
    --card: #1e293b;
    --border: #334155;
    --accent: #60a5fa;
    --warn-bg: #451a03;
    --warn-fg: #fde68a;
  }
  body {
    margin: 0;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 800px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .timestamp { color: #64748b; font-size: 0.9rem; margin-bottom: 20px; }
  .banner {
    background: var(--warn-bg);
    color: var(--warn-fg);
    border-radius: 10px;
    padding: 16px 20px;
    font-size: 1.05rem;
    font-weight: 600;
    margin-bottom: 20px;
  }
  .disclaimer {
    margin-top: 40px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: 0.85rem;
    color: #64748b;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>デイリー・ポートフォリオレポート 2026-11-23</h1>
  <div class="timestamp">生成開始 2026-11-23 07:39 JST</div>
  <div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
  <div class="disclaimer">これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。</div>
</div>
</body>
</html>
