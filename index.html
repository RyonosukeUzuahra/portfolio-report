<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-09-12</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #666666;
    --banner-bg: #fff8e1;
    --banner-border: #f5a623;
    --card-bg: #f7f7f8;
    --border: #e0e0e0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212;
      --fg: #e8e8e8;
      --muted: #a0a0a0;
      --banner-bg: #3a2f10;
      --banner-border: #f5a623;
      --card-bg: #1e1e1e;
      --border: #333333;
    }
  }
  html[data-theme="light"] {
    --bg: #ffffff; --fg: #1a1a1a; --muted: #666666;
    --banner-bg: #fff8e1; --banner-border: #f5a623;
    --card-bg: #f7f7f8; --border: #e0e0e0;
  }
  html[data-theme="dark"] {
    --bg: #121212; --fg: #e8e8e8; --muted: #a0a0a0;
    --banner-bg: #3a2f10; --banner-border: #f5a623;
    --card-bg: #1e1e1e; --border: #333333;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 16px 60px;
    line-height: 1.7;
  }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .timestamp { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
  .banner {
    background: var(--banner-bg);
    border: 1px solid var(--banner-border);
    border-radius: 8px;
    padding: 16px;
    font-size: 1.05rem;
    margin-bottom: 24px;
  }
  .disclaimer {
    margin-top: 32px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.85rem;
  }
</style>
</head>
<body>
<h1>デイリー・ポートフォリオレポート 2026-09-12</h1>
<div class="timestamp">生成開始 2026-09-12 07:03 JST</div>
<div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
<div class="disclaimer">これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。</div>
</body>
</html>
