<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-08-28</title>
<style>
  :root {
    --bg: #f8fafc; --fg: #0f172a; --card: #ffffff; --border: #e2e8f0; --accent: #2563eb;
    --banner-bg: #fef9c3; --banner-fg: #713f12; --banner-border: #eab308;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f172a; --fg: #e2e8f0; --card: #1e293b; --border: #334155; --accent: #60a5fa;
      --banner-bg: #422006; --banner-fg: #fde68a; --banner-border: #ca8a04;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f172a; --fg: #e2e8f0; --card: #1e293b; --border: #334155; --accent: #60a5fa;
    --banner-bg: #422006; --banner-fg: #fde68a; --banner-border: #ca8a04;
  }
  body { background: var(--bg); color: var(--fg); font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; margin: 0; padding: 2rem 1rem; line-height: 1.7; }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: 0.3rem; }
  .timestamp { color: #64748b; font-size: 0.9rem; margin-bottom: 1.5rem; }
  .banner { background: var(--banner-bg); color: var(--banner-fg); border: 1px solid var(--banner-border); border-radius: 8px; padding: 1rem 1.2rem; font-weight: 600; margin-bottom: 1.5rem; }
  .disclaimer { margin-top: 2rem; font-size: 0.85rem; color: #64748b; border-top: 1px solid var(--border); padding-top: 1rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>デイリー・ポートフォリオレポート 2026-08-28</h1>
  <div class="timestamp">生成開始 07:04 JST</div>
  <div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
  <div class="disclaimer">これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。</div>
</div>
</body>
</html>
