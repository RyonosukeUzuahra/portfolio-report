<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー・ポートフォリオレポート 2026-08-21</title>
<style>
  :root {
    --bg: #f8fafc;
    --fg: #0f172a;
    --card-bg: #ffffff;
    --border: #e2e8f0;
    --muted: #64748b;
    --banner-bg: #fef3c7;
    --banner-fg: #92400e;
    --banner-border: #fbbf24;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --fg: #e2e8f0;
      --card-bg: #1e293b;
      --border: #334155;
      --muted: #94a3b8;
      --banner-bg: #451a03;
      --banner-fg: #fde68a;
      --banner-border: #b45309;
    }
  }
  [data-theme="dark"] {
    --bg: #0f172a;
    --fg: #e2e8f0;
    --card-bg: #1e293b;
    --border: #334155;
    --muted: #94a3b8;
    --banner-bg: #451a03;
    --banner-fg: #fde68a;
    --banner-border: #b45309;
  }
  [data-theme="light"] {
    --bg: #f8fafc;
    --fg: #0f172a;
    --card-bg: #ffffff;
    --border: #e2e8f0;
    --muted: #64748b;
    --banner-bg: #fef3c7;
    --banner-fg: #92400e;
    --banner-border: #fbbf24;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    max-width: 900px;
    margin: 0 auto;
    padding: 24px;
    line-height: 1.6;
  }
  h1 { font-size: 1.5rem; }
  .timestamp { color: var(--muted); font-size: 0.9rem; }
  .banner {
    background: var(--banner-bg);
    color: var(--banner-fg);
    border: 1px solid var(--banner-border);
    border-radius: 8px;
    padding: 16px;
    margin: 20px 0;
    font-weight: bold;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin: 16px 0;
  }
  .disclaimer {
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 32px;
    border-top: 1px solid var(--border);
    padding-top: 16px;
  }
</style>
</head>
<body>
  <h1>デイリー・ポートフォリオレポート 2026-08-21</h1>
  <p class="timestamp">生成開始 2026-08-21 07:03 JST</p>
  <div class="banner">⏳ このレポートは現在生成中です。数分後に再読み込みしてください。</div>
  <div class="card">
    <p>本日分のレポートを作成しています。しばらくお待ちください。</p>
  </div>
  <p class="disclaimer">これは参考情報としての提案であり、正式な投資助言ではありません。最終的な売買判断と注文の実行は、ご自身の責任で行ってください。</p>
</body>
</html>
